app-id: org.dash.wallet.desktop
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: dash-wallet
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: dash-wallet
    buildsystem: simple
    build-options:
      no-debuginfo: true
    sources:
      - type: file
        path: dash-wallet.deb
      - type: file
        path: ../../rust/crates/dw-app/linux/org.dash.wallet.desktop.metainfo.xml
    build-commands:
      - ar x dash-wallet.deb
      - tar -xf data.tar.*
      - install -Dm755 usr/bin/dash-wallet -t /app/bin
      - install -Dm644 "usr/share/applications/DashPay Desktop.desktop" /app/share/applications/org.dash.wallet.desktop.desktop
      - desktop-file-edit --set-icon=org.dash.wallet.desktop /app/share/applications/org.dash.wallet.desktop.desktop
      - install -Dm644 usr/share/icons/hicolor/32x32/apps/dash-wallet.png /app/share/icons/hicolor/32x32/apps/org.dash.wallet.desktop.png
      - install -Dm644 usr/share/icons/hicolor/128x128/apps/dash-wallet.png /app/share/icons/hicolor/128x128/apps/org.dash.wallet.desktop.png
      - install -Dm644 usr/share/icons/hicolor/256x256@2/apps/dash-wallet.png /app/share/icons/hicolor/256x256/apps/org.dash.wallet.desktop.png
      - install -Dm644 org.dash.wallet.desktop.metainfo.xml -t /app/share/metainfo
