[package]
name = "dw-console"
description = "dashwallet-desktop local RPC console: dash-qt's command-line grammar and Core-named commands over dw-engine (QT-145)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dashcore = { workspace = true }
dw-engine = { workspace = true }
dw-message = { workspace = true }
dw-vault = { workspace = true }
hex = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
dw-vault = { workspace = true, features = ["insecure-test-kdf"] }
tempfile = { workspace = true }
tokio = { workspace = true }
