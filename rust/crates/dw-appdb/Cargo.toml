[package]
name = "dw-appdb"
description = "App metadata store (app.sqlite per network): address book, labels, tx metadata, receive requests, UTXO locks, settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The same rusqlite and refinery versions platform-wallet-storage uses, so the
# workspace links one bundled libsqlite3 (libsqlite3-sys 0.36).
rusqlite = { version = "0.38", features = ["bundled"] }
refinery = { version = "=0.9.2", default-features = false, features = ["rusqlite"] }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
