[package]
name = "dw-message"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Dash Core signmessage / verifymessage (\"DarkCoin Signed Message:\\n\", 65-byte compact signatures, base64)"

[dependencies]
# Same git source and revision that the platform pin (rust/Cargo.toml) pins.
dashcore = { git = "https://github.com/PastaPastaPasta/rust-dashcore", rev = "e19314aa8222492055e415f930cf03cad2a95228", default-features = false, features = ["secp-recovery"] }
dw-uri = { path = "../dw-uri" }
zeroize = "1.8"

[dev-dependencies]
# For cross-checking against rust-dashcore's own message-signing helpers.
dashcore = { git = "https://github.com/PastaPastaPasta/rust-dashcore", rev = "e19314aa8222492055e415f930cf03cad2a95228", default-features = false, features = ["secp-recovery", "base64"] }
serde_json = "1"
proptest = "1"
