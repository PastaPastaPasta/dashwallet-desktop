[package]
name = "dw-message"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Dash Core signmessage / verifymessage (\"DarkCoin Signed Message:\\n\", 65-byte compact signatures, base64)"

[dependencies]
# Same git source and revision that the platform pin (rust/Cargo.toml) pins.
dashcore = { git = "https://github.com/dashpay/rust-dashcore", rev = "22b5bb2c27589dc9408cf0255c1382becdfd9e01", default-features = false }
dw-uri = { path = "../dw-uri" }
zeroize = "1.8"

[dev-dependencies]
# For cross-checking against rust-dashcore's own message-signing helpers.
dashcore = { git = "https://github.com/dashpay/rust-dashcore", rev = "22b5bb2c27589dc9408cf0255c1382becdfd9e01", default-features = false, features = ["base64"] }
serde_json = "1"
proptest = "1"
