[package]
name = "dw-message"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
description = "Dash Core signmessage / verifymessage (\"DarkCoin Signed Message:\\n\", 65-byte compact signatures, base64)"

[dependencies]
# Same git source and revision that dashpay/platform bc321362b9 pins.
dashcore = { git = "https://github.com/dashpay/rust-dashcore", rev = "e4208c90786a6854bd498315bcb571ef24182c15", default-features = false, features = ["secp-recovery"] }
dw-uri = { path = "../dw-uri" }
zeroize = "1.8"

[dev-dependencies]
# For cross-checking against rust-dashcore's own message-signing helpers.
dashcore = { git = "https://github.com/dashpay/rust-dashcore", rev = "e4208c90786a6854bd498315bcb571ef24182c15", default-features = false, features = ["secp-recovery", "base64"] }
serde_json = "1"
proptest = "1"
