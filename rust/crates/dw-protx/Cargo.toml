[package]
name = "dw-protx"
description = "ProTx builders, v24 shared masternodes and the masternode keychain for dashwallet-desktop (QT-118..127, IOS-080..083)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Owner: R3 (docs/contracts/m3-engine.md §0).

[dependencies]
# `bls` (blsful) for operator keys and payload signatures, `eddsa` for the
# platform node id. Both are already enabled in the graph by platform-wallet.
dashcore = { workspace = true, features = ["bls", "eddsa"] }
getrandom = "=0.2.17"
hex = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
