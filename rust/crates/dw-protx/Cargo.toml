[package]
name = "dw-protx"
description = "Owner-side ProTx builders and v24 shared-masternode codecs for dashwallet-desktop (QT-118..127, IOS-080..083)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Salvaged from m3/r3-protx (MG-01); the engine integration is MG-03's.

[dependencies]
# `bls` to check operator public keys, `eddsa` for the platform node id.
# Both are already enabled in the graph by platform-wallet.
dashcore = { workspace = true, features = ["bls", "eddsa"] }
hex = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
dw-uri = { workspace = true }
serde_json = "1"
