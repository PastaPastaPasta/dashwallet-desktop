[package]
name = "dw-fs"
description = "Owner-only directories and files for the wallet's data, changed through descriptors that never follow a swapped-in symlink"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
# openat/mkdirat/fstat/fchmod on directory descriptors; the version already
# in the graph (tempfile).
rustix = { version = "1", default-features = false, features = ["std", "fs", "process"] }

[dev-dependencies]
dw-testutil = { workspace = true }
