[package]
name = "dw-engine"
description = "dashwallet-desktop engine: tokio runtime, per-network sessions over platform-wallet + SqlitePersister"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Off by default: the Orchard shielded pool pulls in halo2 (build time, binary
# size, prover warm-up; E0-12, docs/research/shielded-cost.md). Enables the
# platform-wallet shielded wallet and its SqlitePersister tables.
shielded = ["platform-wallet/shielded", "platform-wallet-storage/shielded"]

[[example]]
name = "shielded_warmup"
required-features = ["shielded"]

[dependencies]
platform-wallet = { workspace = true }
platform-wallet-storage = { workspace = true }
dash-sdk = { workspace = true }
dash-context-provider = { workspace = true }
rs-sdk-trusted-context-provider = { workspace = true }
dpp = { workspace = true }
# `eddsa`: the masternode keychain's platform node keys (already on in the
# graph through platform-wallet).
dashcore = { workspace = true, features = ["eddsa"] }
key-wallet = { workspace = true }
dash-spv = { workspace = true }
# Validate the DAPI CA file at open the way the SDK's TLS stack will parse it
# (already in the graph through tonic).
rustls-pki-types = "1"
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["alloc"] }
dw-appdb = { workspace = true }
# M3 (docs/contracts/m3-engine.md): CoinJoin over dw-coinjoin/dw-p2p.
dw-coinjoin = { workspace = true }
dw-p2p = { workspace = true }
dw-units = { workspace = true }
dw-compat = { workspace = true }
dw-psbt = { workspace = true }
dw-uri = { workspace = true }
dw-vault = { workspace = true }
# Owner-only directories and files, changed through descriptors.
dw-fs = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
hex = { workspace = true }
zeroize = { workspace = true }
rand = "0.8"
# dpp `Signer` and platform-wallet `ContactCryptoProvider` are async traits.
async-trait = "0.1"
# .dwbackup container (JSON header/body, base64 of the wallet.sqlite snapshot).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Read-only enumeration of persisted transaction ids in wallet.sqlite (the
# persister has no list API); same version dw-appdb and
# platform-wallet-storage link, so one bundled libsqlite3.
rusqlite = { version = "0.38", features = ["bundled"] }

[dev-dependencies]
# Cheap Argon2id parameters for test vaults (debug builds only, never mainnet/testnet).
dw-vault = { workspace = true, features = ["insecure-test-kdf"] }
dw-message = { workspace = true }
serde_json = "1"
tempfile = { workspace = true }
# private_tempdir(): engine data roots that pass the storage permission check under any umask.
dw-testutil = { workspace = true }
# `test-util`: paused clocks for the event pump and gate tests.
tokio = { workspace = true, features = ["test-util"] }
# tests/m4_dashpay_contract.rs renders the DashPay facade's surface from its
# source for docs/contracts/m4-dashpay-engine.md (both already in the graph).
syn = { version = "2", features = ["full", "printing"] }
quote = "1"
# The listing's fingerprint, and compile-time checks that bearer secrets
# never serialize, print or copy.
sha2 = "0.10"
static_assertions = "1"

[target.'cfg(unix)'.dev-dependencies]
# tests/umask_002.rs sets the process umask.
libc = "0.2"
