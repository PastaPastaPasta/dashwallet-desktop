[package]
name = "dw-uri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "dash: URI parsing/writing (dash-qt exact and iOS superset), deep-link and address classification"

[dependencies]
# Same git source and revision that the platform pin (rust/Cargo.toml) pins, so the
# workspace resolves one copy whether or not it declares the dependency.
dashcore = { git = "https://github.com/dashpay/rust-dashcore", rev = "8fe0a38170059742ff902acc29a696b72490903c", default-features = false, features = ["secp-recovery"] }
dw-units = { path = "../dw-units" }
zeroize = "1.8"
# Module matrices only: the image/svg renderers stay off.
qrcode = { version = "0.14", default-features = false }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = "1"
proptest = "1"
