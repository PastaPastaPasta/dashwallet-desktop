[package]
name = "dw-uri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "dash: URI parsing/writing (dash-qt exact and iOS superset), deep-link and address classification"

[dependencies]
# Same git source and revision that the platform pin (rust/Cargo.toml) pins, so the
# workspace resolves one copy whether or not it declares the dependency.
dashcore = { git = "https://github.com/dashpay/rust-dashcore", rev = "aa0642e539a0863ea6047e32c1a45fcfa8539548", default-features = false }
dw-units = { path = "../dw-units" }
bech32 = { version = "0.11.1", default-features = false, features = ["alloc"] }
zeroize = "1.8"
# Module matrices only: the image/svg renderers stay off.
qrcode = { version = "0.14", default-features = false }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = "1"
proptest = "1"
