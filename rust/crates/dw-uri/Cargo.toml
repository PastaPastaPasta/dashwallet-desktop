[package]
name = "dw-uri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "dash: URI parsing/writing (dash-qt exact and iOS superset), deep-link and address classification"

[dependencies]
# Same git source and revision that dashpay/platform bc41f1bc23 pins, so the
# workspace resolves one copy whether or not it declares the dependency.
dashcore = { git = "https://github.com/dashpay/rust-dashcore", rev = "40268cc0402a8933ec539f16b2d634c4e25876ad", default-features = false, features = ["secp-recovery"] }
dw-units = { path = "../dw-units" }
zeroize = "1.8"
# Module matrices only: the image/svg renderers stay off.
qrcode = { version = "0.14", default-features = false }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = "1"
proptest = "1"
