[package]
name = "dw-app"
description = "dashwallet-desktop on Tauri 2: commands, generated TypeScript types and the event bridge over dw-engine, linked in-process (DASHPAY §2.1, E0-13)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# `tauri build` reads this for the bundle; the binary name matches tauri.conf.json `mainBinaryName`.
default-run = "dash-wallet"

[lib]
name = "dw_app"
path = "src/lib.rs"

[[bin]]
name = "dash-wallet"
path = "src/main.rs"

[features]
# The self-test (`--selftest`, `--selftest-pause`, `--selftest-passphrase-file`)
# and its commands and grants (src/api/selftest.rs, capabilities-selftest/).
# Off in release and packaged builds; tauri-selftest.yml builds a binary with
# it (E0-13 D17).
selftest = []

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# `tray-icon`: the tray companion (U-01, src/shell/tray.rs).
tauri = { version = "2.12", features = ["tray-icon"] }
# U-01: the main window's size and position, saved and restored.
tauri-plugin-window-state = "2.5"
# Byte payloads (avatars, raw transactions) cross IPC as base64 strings.
base64 = "0.22"
# The default data root, as Tauri's `app_data_dir` finds it, before the app is built.
dirs = "7"
# Canonical data roots without Windows' `\\?\` prefix.
dunce = "1"
dashcore = { workspace = true }
dw-coinjoin = { workspace = true }
dw-console = { workspace = true }
dw-engine = { workspace = true }
# create_private_dir: the data root, made before its instance lock (src/instance.rs);
# open_owner_only: the self-test's passphrase file must be the user's alone.
dw-fs = { workspace = true }
dw-message = { workspace = true }
dw-psbt = { workspace = true }
dw-units = { workspace = true }
dw-uri = { workspace = true }
dw-vault = { workspace = true }
hex = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TypeScript declarations of every record that crosses the IPC boundary, and
# the command wrappers built from them (apps/desktop/src/api/generated,
# checked by `codegen::tests::bindings_are_current`).
ts-rs = { version = "12", features = ["no-serde-warnings", "serde-json-impl"] }
thiserror = { workspace = true }
# `signal`: SIGTERM/SIGINT end the app through its normal exit path.
tokio = { workspace = true, features = ["signal"] }
zeroize = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# The tray's AppIndicator probe: libappindicator-sys aborts without one.
libloading = "0.8"
# The session-bus probe before the single-instance plugin, which panics on a
# malformed bus address (shell/native.rs).
zbus = "5"

[target.'cfg(not(target_os = "macos"))'.dependencies]
# U-01: a second launch hands its links to the running app and exits (not on
# macOS, where LaunchServices keeps one instance: shell/native.rs).
tauri-plugin-single-instance = "2.5"

[dev-dependencies]
tauri = { version = "2.12", features = ["test", "tray-icon"] }
tempfile = { workspace = true }
# Cheap Argon2id parameters for test vaults (debug builds only, never mainnet/testnet).
dw-vault = { workspace = true, features = ["insecure-test-kdf"] }
# private_tempdir(): engine data roots that pass the storage permission check under any umask.
dw-testutil = { workspace = true }
