[package]
name = "dw-compat"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
description = "Dash Core compatibility: Core's BIP39 quirks and the dumpwallet file format"

[dependencies]
# Same git source and revision that dashpay/platform bc321362b9 pins.
dashcore = { git = "https://github.com/dashpay/rust-dashcore", rev = "e4208c90786a6854bd498315bcb571ef24182c15", default-features = false, features = ["secp-recovery"] }
key-wallet = { git = "https://github.com/dashpay/rust-dashcore", rev = "e4208c90786a6854bd498315bcb571ef24182c15", default-features = false }
dw-uri = { path = "../dw-uri" }
unicode-normalization = "0.1"
zeroize = "1.8"

[dev-dependencies]
serde_json = "1"
proptest = "1"
