[package]
name = "dw-vault"
description = "dashwallet-desktop secret vault: DEK + wrap slots, lock states, auth grants, VaultSigner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Lets callers outside this crate's own tests pick Argon2id parameters below
# the production floor (KdfPolicy::Fixed). Only honoured in debug builds and
# never on mainnet/testnet vaults. Enable from [dev-dependencies] only.
insecure-test-kdf = []

[dependencies]
# Same crypto stack (and exact versions) platform-wallet-storage's `secrets`
# feature locks; the OS-store slot goes through its keyring backends.
platform-wallet-storage = { workspace = true }
argon2 = { version = "=0.5.3", features = ["zeroize"] }
chacha20poly1305 = "=0.10.1"
getrandom = "=0.2.17"
subtle = "=2.6.1"
sha2 = "0.10"
key-wallet = { workspace = true }
dashcore = { workspace = true }
dw-compat = { workspace = true }
dw-message = { workspace = true }
dw-uri = { workspace = true }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
thiserror = { workspace = true }
tracing = { workspace = true }
hex = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
# The integration tests in tests/ use Argon2id parameters below the floor.
dw-vault = { path = ".", features = ["insecure-test-kdf"] }
tempfile = { workspace = true }
tokio = { workspace = true }
