# dashwallet-desktop Rust workspace.
#
# Members are a GLOB on purpose: workstreams add crates under crates/ and bin/
# in parallel, and an explicit list would be a merge-conflict hot spot.
[workspace]
resolver = "2"
members = ["crates/*", "bin/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
# ---- dashpay/platform, pinned to #5307 (v5.1 move)@f475f72a11 (DESIGN.md R3, DEC-168) ----
# Cargo.lock was seeded from the platform checkout's lock at this revision so
# the shared transitive graph (grovedb, rusqlite, tokio, ...) resolves to the
# versions upstream builds and tests with.
platform-wallet = { git = "https://github.com/dashpay/platform", rev = "f475f72a1112f2c6d84b9d7cd1bc4d6ab7540bd3", features = ["bls", "eddsa"] }
# `sqlite` = SqlitePersister, `secrets` = vault/keyring primitives (WS-03).
# `shielded` is deliberately off for M0 (halo2 build cost, DESIGN-opus G4).
platform-wallet-storage = { git = "https://github.com/dashpay/platform", rev = "f475f72a1112f2c6d84b9d7cd1bc4d6ab7540bd3", default-features = false, features = ["sqlite", "secrets"] }
# Default features kept, as platform-wallet-ffi (the iOS build) does.
dash-sdk = { git = "https://github.com/dashpay/platform", rev = "f475f72a1112f2c6d84b9d7cd1bc4d6ab7540bd3", features = ["wallet", "dashpay-contract", "dpns-contract"] }
# `ed25519-dalek`: platform-wallet's masternode locator imports `dpp::ed25519_dalek`
# but its manifest does not enable the feature (the platform workspace gets it by
# feature unification).
dpp = { git = "https://github.com/dashpay/platform", rev = "f475f72a1112f2c6d84b9d7cd1bc4d6ab7540bd3", features = ["ed25519-dalek"] }
dash-context-provider = { git = "https://github.com/dashpay/platform", rev = "f475f72a1112f2c6d84b9d7cd1bc4d6ab7540bd3" }
# `dpns-contract`: the provider serves the DPNS contract that the contested-name
# vote-state proofs need (DP1-03), as rs-sdk-ffi (the iOS build) enables it.
rs-sdk-trusted-context-provider = { git = "https://github.com/dashpay/platform", rev = "f475f72a1112f2c6d84b9d7cd1bc4d6ab7540bd3", features = ["dpns-contract"] }
# DIP-15 DashPay crypto (ECDH, account reference, contactInfo AES) for the
# vault's Platform signers; the same functions platform-wallet calls.
platform-encryption = { git = "https://github.com/dashpay/platform", rev = "f475f72a1112f2c6d84b9d7cd1bc4d6ab7540bd3" }

# ---- dashpay/rust-dashcore: EXACTLY the revision platform pins (platform Cargo.toml) ----
# A different revision would duplicate every dashcore type in the graph.
dashcore = { git = "https://github.com/dashpay/rust-dashcore", rev = "8fe0a38170059742ff902acc29a696b72490903c" }
key-wallet = { git = "https://github.com/dashpay/rust-dashcore", rev = "8fe0a38170059742ff902acc29a696b72490903c" }
key-wallet-manager = { git = "https://github.com/dashpay/rust-dashcore", rev = "8fe0a38170059742ff902acc29a696b72490903c" }
dash-spv = { git = "https://github.com/dashpay/rust-dashcore", rev = "8fe0a38170059742ff902acc29a696b72490903c" }
dashcore-rpc = { git = "https://github.com/dashpay/rust-dashcore", rev = "8fe0a38170059742ff902acc29a696b72490903c" }
# ---- dashpay/base-sdk: EXACTLY the revision that rust-dashcore pins ----
dash-pkc = { git = "https://github.com/dashpay/base-sdk", rev = "e6402ced257c370a586ade9840ebbf545a4b7926", default-features = false }

# ---- our crates ----
dw-appdb = { path = "crates/dw-appdb" }
dw-coinjoin = { path = "crates/dw-coinjoin" }
dw-compat = { path = "crates/dw-compat" }
dw-console = { path = "crates/dw-console" }
dw-desktop = { path = "crates/dw-desktop" }
dw-engine = { path = "crates/dw-engine" }
dw-fs = { path = "crates/dw-fs" }
dw-message = { path = "crates/dw-message" }
dw-p2p = { path = "crates/dw-p2p" }
dw-psbt = { path = "crates/dw-psbt" }
dw-testutil = { path = "crates/dw-testutil" }
dw-units = { path = "crates/dw-units" }
dw-uri = { path = "crates/dw-uri" }
dw-vault = { path = "crates/dw-vault" }

# ---- third party ----
uniffi = { version = "=0.32.2" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
thiserror = "2"
tracing = "0.1"
hex = "0.4"
zeroize = "1"
tempfile = "3"

[profile.dev]
debug = "line-tables-only"

# Dependencies are optimised even in dev so BLS / X11 / Argon2 are usable.
# Dependency debug info is dropped to keep the shared target dir small (G4).
[profile.dev.package."*"]
opt-level = 2
debug = false

# Same heavy-crypto overrides as the platform workspace.
[profile.dev.package.argon2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
# Panics must stay catchable: UniFFI turns them into errors instead of
# aborting the GUI process.
panic = "unwind"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
