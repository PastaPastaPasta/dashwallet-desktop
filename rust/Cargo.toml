# dashwallet-desktop Rust workspace.
#
# Members are a GLOB on purpose: workstreams add crates under crates/ and bin/
# in parallel, and an explicit list would be a merge-conflict hot spot.
[workspace]
resolver = "2"
members = ["crates/*", "bin/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
# ---- dashpay/platform, pinned to v5.0-dev@bc321362b9 (DESIGN.md R3) ----
# Cargo.lock was seeded from the platform checkout's lock at this revision so
# the shared transitive graph (grovedb, rusqlite, tokio, ...) resolves to the
# versions upstream builds and tests with.
platform-wallet = { git = "https://github.com/dashpay/platform", rev = "bc321362b9ff9c8ac24244f9d4b09ec3de7a5938", features = ["bls", "eddsa"] }
# `sqlite` = SqlitePersister, `secrets` = vault/keyring primitives (WS-03).
# `shielded` is deliberately off for M0 (halo2 build cost, DESIGN-opus G4).
platform-wallet-storage = { git = "https://github.com/dashpay/platform", rev = "bc321362b9ff9c8ac24244f9d4b09ec3de7a5938", default-features = false, features = ["sqlite", "secrets"] }
# Default features kept, as platform-wallet-ffi (the iOS build) does.
dash-sdk = { git = "https://github.com/dashpay/platform", rev = "bc321362b9ff9c8ac24244f9d4b09ec3de7a5938", features = ["wallet", "dashpay-contract", "dpns-contract"] }
dpp = { git = "https://github.com/dashpay/platform", rev = "bc321362b9ff9c8ac24244f9d4b09ec3de7a5938" }
dash-context-provider = { git = "https://github.com/dashpay/platform", rev = "bc321362b9ff9c8ac24244f9d4b09ec3de7a5938" }
rs-sdk-trusted-context-provider = { git = "https://github.com/dashpay/platform", rev = "bc321362b9ff9c8ac24244f9d4b09ec3de7a5938" }

# ---- dashpay/rust-dashcore: EXACTLY the revision platform pins (platform Cargo.toml) ----
# A different revision would duplicate every dashcore type in the graph.
dashcore = { git = "https://github.com/dashpay/rust-dashcore", rev = "e4208c90786a6854bd498315bcb571ef24182c15" }
key-wallet = { git = "https://github.com/dashpay/rust-dashcore", rev = "e4208c90786a6854bd498315bcb571ef24182c15" }
key-wallet-manager = { git = "https://github.com/dashpay/rust-dashcore", rev = "e4208c90786a6854bd498315bcb571ef24182c15" }
dash-spv = { git = "https://github.com/dashpay/rust-dashcore", rev = "e4208c90786a6854bd498315bcb571ef24182c15" }
dashcore-rpc = { git = "https://github.com/dashpay/rust-dashcore", rev = "e4208c90786a6854bd498315bcb571ef24182c15" }

# ---- our crates ----
dw-appdb = { path = "crates/dw-appdb" }
dw-compat = { path = "crates/dw-compat" }
dw-engine = { path = "crates/dw-engine" }
dw-message = { path = "crates/dw-message" }
dw-psbt = { path = "crates/dw-psbt" }
dw-units = { path = "crates/dw-units" }
dw-uri = { path = "crates/dw-uri" }
dw-vault = { path = "crates/dw-vault" }

# ---- third party ----
uniffi = { version = "=0.32.2" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
thiserror = "2"
tracing = "0.1"
hex = "0.4"
zeroize = "1"
tempfile = "3"

[profile.dev]
debug = "line-tables-only"

# Dependencies are optimised even in dev so BLS / X11 / Argon2 are usable.
# Dependency debug info is dropped to keep the shared target dir small (G4).
[profile.dev.package."*"]
opt-level = 2
debug = false

# Same heavy-crypto overrides as the platform workspace.
[profile.dev.package.argon2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
# Panics must stay catchable: UniFFI turns them into errors instead of
# aborting the GUI process.
panic = "unwind"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
