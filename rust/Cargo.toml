# dashwallet-desktop Rust workspace.
#
# Members are a GLOB on purpose: workstreams add crates under crates/ and bin/
# in parallel, and an explicit list would be a merge-conflict hot spot.
[workspace]
resolver = "2"
members = ["crates/*", "bin/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
# ---- dashpay/platform, pinned to pasta's fork (DESIGN.md R3, DEC-18, DEC-168) ----
# PastaPastaPasta/platform dw/0.1.x-core-bridge-updated-utxos@7537f4a264 = the fork below
# + dashpay/platform#5792, with rust-dashcore pinned to the backport of #1326 (issue #1361).
# dw/0.1.x-restore-utxos-5780@8838305277
# = dw/0.1.x-restore-utxos@2ce6aae742 with its early restore_utxos rounds reverted
# + dashpay/platform#5780 as of 907a5d2b: the SQLite rehydrate placing each restored
# UTXO in the funds account that derives its address (key-wallet `restore_utxos`,
# dashpay/platform#5724), on the rust-dashcore backport below
# + a test-only `Hash` import that backport needs. Re-pin to upstream once #5780 merges.
# dw/0.1.x-restore-utxos@2ce6aae742 = dw/bl187-v24-dashcore@dc0c946307 + early rounds of the above.
# dw/bl187-v24-dashcore@dc0c946307 = dw/dp3-04b-pool-rotation@82fb33aff8
# + rust-dashcore 626c91d1 with upstream's adaptations to it (#5307, #5392, #5403, #5423; BL-187)
# + MasternodeListSummary.net_info, every net-info entry of the list (MG-04b D39, D75).
# dw/dp3-04b-pool-rotation@82fb33aff8 = dw/e0-10c-v5.1-spv-trust
# @ebe37f8a67 (#5307 (v5.1 move)@f475f72a11 + #4978 (ad601d1d8b) + #5366 (SPV quorum
# key with its status)) + the storage fix for a DashPay contact's xpub rotation and
# its persisted account stamp (DP3-04b; fork migration 1 in its own history,
# design D32). Move back to an upstream revision once all of them are on
# v5.1-dev; that bump adds a reconcile from fork V1 to upstream's number (D36).
# Cargo.lock was seeded from the platform checkout's lock at this revision so
# the shared transitive graph (grovedb, rusqlite, tokio, ...) resolves to the
# versions upstream builds and tests with.
# `shielded`: the Orchard pool (halo2, orchard, the commitment tree), on since
# 0.1 ships shielded funds (RELEASE-PLAN §1; cost in docs/research/shielded-cost.md).
# It turns on `dash-sdk/shielded` and `dpp/shielded-client` too.
platform-wallet = { git = "https://github.com/PastaPastaPasta/platform", rev = "7537f4a264fb94740a383fd0ced7e779ca0175e9", features = ["bls", "eddsa", "shielded"] }
# `sqlite` = SqlitePersister, `secrets` = vault/keyring primitives (WS-03),
# `shielded` = the persister's shielded tables.
platform-wallet-storage = { git = "https://github.com/PastaPastaPasta/platform", rev = "7537f4a264fb94740a383fd0ced7e779ca0175e9", default-features = false, features = ["sqlite", "secrets", "shielded"] }
# Default features kept, as platform-wallet-ffi (the iOS build) does.
dash-sdk = { git = "https://github.com/PastaPastaPasta/platform", rev = "7537f4a264fb94740a383fd0ced7e779ca0175e9", features = ["wallet", "dashpay-contract", "dpns-contract"] }
# `ed25519-dalek`: platform-wallet's masternode locator imports `dpp::ed25519_dalek`
# but its manifest does not enable the feature (the platform workspace gets it by
# feature unification).
dpp = { git = "https://github.com/PastaPastaPasta/platform", rev = "7537f4a264fb94740a383fd0ced7e779ca0175e9", features = ["ed25519-dalek"] }
dash-context-provider = { git = "https://github.com/PastaPastaPasta/platform", rev = "7537f4a264fb94740a383fd0ced7e779ca0175e9" }
# Drive's document cost estimator (`drive::drive::document::cost`, the one
# wasm-sdk exposes), for the credits cost table (DP1-06). `verify` is the
# feature dash-sdk already builds it with.
drive = { git = "https://github.com/PastaPastaPasta/platform", rev = "7537f4a264fb94740a383fd0ced7e779ca0175e9", default-features = false, features = ["verify"] }
# `dpns-contract`: the provider serves the DPNS contract that the contested-name
# vote-state proofs need (DP1-03), as rs-sdk-ffi (the iOS build) enables it;
# `dashpay-contract`: the DashPay contract that a broadcast contactRequest's
# proof is verified against (DP2-02).
rs-sdk-trusted-context-provider = { git = "https://github.com/PastaPastaPasta/platform", rev = "7537f4a264fb94740a383fd0ced7e779ca0175e9", features = ["dpns-contract", "dashpay-contract"] }
# DIP-15 DashPay crypto (ECDH, account reference, contactInfo AES) for the
# vault's Platform signers; the same functions platform-wallet calls.
platform-encryption = { git = "https://github.com/PastaPastaPasta/platform", rev = "7537f4a264fb94740a383fd0ced7e779ca0175e9" }

# ---- rust-dashcore: EXACTLY the revision platform pins (platform Cargo.toml) ----
# A different revision would duplicate every dashcore type in the graph.
# PastaPastaPasta/rust-dashcore dw/0.1.x-confirm-credits-rescan-outputs@846ffe54 = dashpay
# 626c91d1 + #1112, #1105, #1295 (`ManagedWalletInfo::restore_utxos`) and #1326 (issue
# #1361), cherry-picked; back to a dashpay revision at the next platform re-pin.
dashcore = { git = "https://github.com/PastaPastaPasta/rust-dashcore", rev = "846ffe54fe4d0bf1b4e6d4683a7a57989860a1df" }
key-wallet = { git = "https://github.com/PastaPastaPasta/rust-dashcore", rev = "846ffe54fe4d0bf1b4e6d4683a7a57989860a1df" }
key-wallet-manager = { git = "https://github.com/PastaPastaPasta/rust-dashcore", rev = "846ffe54fe4d0bf1b4e6d4683a7a57989860a1df" }
dash-spv = { git = "https://github.com/PastaPastaPasta/rust-dashcore", rev = "846ffe54fe4d0bf1b4e6d4683a7a57989860a1df" }
dashcore-rpc = { git = "https://github.com/PastaPastaPasta/rust-dashcore", rev = "846ffe54fe4d0bf1b4e6d4683a7a57989860a1df" }
# ---- dashpay/base-sdk: EXACTLY the revision that rust-dashcore pins ----
dash-pkc = { git = "https://github.com/dashpay/base-sdk", rev = "33fcc59e1868c803f9608e0e78ee8bddf3abcee7", default-features = false }

# ---- our crates ----
dw-appdb = { path = "crates/dw-appdb" }
dw-coinjoin = { path = "crates/dw-coinjoin" }
dw-compat = { path = "crates/dw-compat" }
dw-console = { path = "crates/dw-console" }
dw-desktop = { path = "crates/dw-desktop" }
dw-engine = { path = "crates/dw-engine" }
dw-fs = { path = "crates/dw-fs" }
dw-governance = { path = "crates/dw-governance" }
dw-message = { path = "crates/dw-message" }
dw-p2p = { path = "crates/dw-p2p" }
dw-protx = { path = "crates/dw-protx" }
dw-psbt = { path = "crates/dw-psbt" }
dw-testutil = { path = "crates/dw-testutil" }
dw-units = { path = "crates/dw-units" }
dw-uri = { path = "crates/dw-uri" }
dw-vault = { path = "crates/dw-vault" }

# ---- third party ----
uniffi = { version = "=0.32.2" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
thiserror = "2"
tracing = "0.1"
hex = "0.4"
zeroize = "1"
tempfile = "3"

[profile.dev]
debug = "line-tables-only"

# Dependencies are optimised even in dev so BLS / X11 / Argon2 are usable.
# Dependency debug info is dropped to keep the shared target dir small (G4).
[profile.dev.package."*"]
opt-level = 2
debug = false

# Same heavy-crypto overrides as the platform workspace.
[profile.dev.package.argon2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
# Panics must stay catchable: UniFFI turns them into errors instead of
# aborting the GUI process.
panic = "unwind"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
