[package]
name = "uniffi-bindgen"
description = "Pinned uniffi-bindgen CLI (same version as the uniffi runtime in dw-ffi)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { workspace = true, features = ["cli"] }
