# Nightly (roadmap T-03; DASHPAY §6 tiers T1 and GUI):
# - regtest: the dashd v24 regtest suites of regtest/README.md against a host-built dwcli, and
#   dwcli's tests with each of its debug features (`invitation-create-test`, `platform-addr-fund`,
#   `mix-shield-test`);
# - crossui-linux: scripts/crossui-linux-demo.sh (the SwiftCrossUI app driven through AT-SPI under
#   Xvfb in Docker, M1 and M2 flows);
# - shielded: the Orchard prover warm-up in a cold process (E0-12); the pool itself is built and
#   tested by PR CI since 0.1 turned it on;
# - release-check: the release legs of dw-engine's tests/mg04b_release_check.rs (MG-04b D71) and
#   tests/mix_shield_release_check.rs (dwcli's `mix-shield-test`), which PR CI, testing in debug
#   only, never runs;
# - fuzz: scripts/fuzz.sh, libFuzzer on the parsers of untrusted input (H-02), 10 minutes a target;
# - kill9: dw-engine's kill -9 matrix (H-03), each row a child process killed with SIGKILL and
#   the data folder opened again; a `kill9_finding_<issue>` row reproduces an open issue and is
#   skipped until its fix.
#
# `schedule` runs only from the repository's default branch. Once the setup steps have passed,
# every suite step runs even when an earlier one failed, so one run reports them all.
name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  PROTOC_VERSION: "29.3"
  DWD_MIN_FREE_GB: "5"
  DASHCORE_DIR: ${{ github.workspace }}/.dashcore
  # Owner-only scratch for the functional framework (dwcli refuses a database below a
  # group-writable directory).
  DWD_FUNC_TMP: ${{ github.workspace }}/.functional-tmp
  LOGS: ${{ github.workspace }}/regtest-logs

jobs:
  regtest:
    name: Regtest suites (T1)
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    env:
      # The pytest suites use the image built by the "Build the regtest image" step.
      DWD_REGTEST_BUILD: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: ci/github/linux-free-disk.sh
      - name: Rust toolchain (rust-toolchain.toml)
        working-directory: rust
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
          shared-key: ci-${{ runner.os }}
          save-if: false
      - uses: ./.github/actions/pinned-sources
      # `mix-shield-test` adds only test_move_mixed.py's `coinjoin-test-addresses` (debug builds
      # only; the release-check job proves it absent from a release build).
      - name: Build dwcli
        id: dwcli
        working-directory: rust
        run: |
          cargo build -p dwcli --features mix-shield-test --locked
          echo "DWCLI=$PWD/target/debug/dwcli" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/dwd-dashcore
          key: dashcore-${{ runner.os }}-${{ hashFiles('regtest/scripts/fetch-dashcore.sh') }}
      - name: Dash Core release (verified) and Python environments
        run: |
          sh regtest/scripts/fetch-dashcore.sh "$DASHCORE_DIR"
          uv venv regtest/harness/.venv --python 3.12
          uv pip install --python regtest/harness/.venv/bin/python -r regtest/harness/requirements.txt
          uv venv .func-venv --python 3.12
          # dash_hash 1.4.0 (X11 for the functional framework) from its commit archive, hash-checked.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 -o "$RUNNER_TEMP/dash_hash.tar.gz" \
            https://github.com/dashpay/dash_hash/archive/7af387315d9064ec3a751545fee0524d997c8867.tar.gz
          echo "7153d3341e3a6b1a2a1365dbdf9ff6315fa7c6c67b60506e91ffd93383a601d5  $RUNNER_TEMP/dash_hash.tar.gz" | sha256sum -c -
          uv pip install --python .func-venv/bin/python "$RUNNER_TEMP/dash_hash.tar.gz"
          mkdir -p "$LOGS"
      - name: Build the regtest image
        id: setup
        run: docker compose -f regtest/docker-compose.yml build dashd

      - name: harness (smoke)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: regtest/harness
        run: .venv/bin/python -m pytest -v tests/test_smoke.py tests/test_harness.py --junitxml="$LOGS/harness.xml"
      - name: l1-sync
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: regtest/harness
        run: .venv/bin/python -m pytest -v tests/test_l1_sync.py --junitxml="$LOGS/l1-sync.xml"
      - name: l1-send
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: regtest/harness
        run: .venv/bin/python -m pytest -v tests/test_l1_send.py --junitxml="$LOGS/l1-send.xml"
      - name: l2-tools
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: regtest/harness
        run: .venv/bin/python -m pytest -v tests/test_l2_tools.py --junitxml="$LOGS/l2-tools.xml"
      - name: move-mixed (consolidation and move to Core)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: regtest/harness
        run: .venv/bin/python -m pytest -v tests/test_move_mixed.py --junitxml="$LOGS/move-mixed.xml"
      - name: e0-04 BL-76 (engine SPV against dashd)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: rust
        run: DASHD_PATH="$DASHCORE_DIR/bin/dashd" cargo test -p dw-engine --test e0_04_bl76_regtest -- --nocapture
      - name: restore-utxos (CoinJoin coins past index 99 against dashd)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: rust
        run: DASHD_PATH="$DASHCORE_DIR/bin/dashd" cargo test -p dw-engine --test restore_utxos_regtest -- --nocapture
      - name: restore
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: regtest/harness
        run: .venv/bin/python -m pytest -v tests/test_restore.py --junitxml="$LOGS/restore.xml"
      - name: functional (masternodes, ChainLocks, CoinJoin probe; Docker)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          DWD_FUNC_LOGDIR: ${{ env.LOGS }}/functional
        run: regtest/scripts/run-functional.sh dwd_mn_chainlock.py dwd_coinjoin_probe.py
      - name: coinjoin (our client against 4 masternodes; host)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          DWD_PYTHON: ${{ github.workspace }}/.func-venv/bin/python
        run: |
          regtest/functional/run.sh dwd_coinjoin_client.py --portseed=4711 --loglevel=INFO \
            > "$LOGS/coinjoin.log" 2>&1 || { tail -n 200 "$LOGS/coinjoin.log"; exit 1; }
          tail -n 20 "$LOGS/coinjoin.log"
      - name: masternodes (the masternodes facade against Core's list; host)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          DWD_PYTHON: ${{ github.workspace }}/.func-venv/bin/python
        run: |
          regtest/functional/run.sh dwd_masternodes.py --portseed=4731 --loglevel=INFO \
            > "$LOGS/masternodes.log" 2>&1 || { tail -n 200 "$LOGS/masternodes.log"; exit 1; }
          tail -n 20 "$LOGS/masternodes.log"
      - name: governance (govsync, proposals and voting against 4 masternodes; host)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          DWD_PYTHON: ${{ github.workspace }}/.func-venv/bin/python
        run: |
          regtest/functional/run.sh dwd_governance.py --portseed=4741 --loglevel=INFO \
            > "$LOGS/governance.log" 2>&1 || { tail -n 200 "$LOGS/governance.log"; exit 1; }
          tail -n 20 "$LOGS/governance.log"
      - name: protx (ProRegTx and ProUpRegTx owner flows; host)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          DWD_PYTHON: ${{ github.workspace }}/.func-venv/bin/python
        run: |
          regtest/functional/run.sh dwd_protx.py --portseed=4751 --loglevel=INFO \
            > "$LOGS/protx.log" 2>&1 || { tail -n 200 "$LOGS/protx.log"; exit 1; }
          tail -n 20 "$LOGS/protx.log"
      - name: protx-v24 (ProTx owner flows with v24 active; host)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          DWD_PYTHON: ${{ github.workspace }}/.func-venv/bin/python
          DWD_MG04_V24: "1"
        run: |
          regtest/functional/run.sh dwd_protx.py --portseed=4761 --loglevel=INFO \
            > "$LOGS/protx-v24.log" 2>&1 || { tail -n 200 "$LOGS/protx-v24.log"; exit 1; }
          tail -n 20 "$LOGS/protx-v24.log"
      - name: shared (v24 shared masternode sessions and maintenance; host)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          DWD_PYTHON: ${{ github.workspace }}/.func-venv/bin/python
        run: |
          regtest/functional/run.sh dwd_shared.py --portseed=4771 --timeout-factor=4 --loglevel=INFO \
            > "$LOGS/shared.log" 2>&1 || { tail -n 200 "$LOGS/shared.log"; exit 1; }
          tail -n 20 "$LOGS/shared.log"
      # PR CI runs only the table tests with `invitation-create-test` and `coinjoin::tests` with
      # `mix-shield-test`. These need dwcli's build, not the regtest image.
      - name: dwcli tests with the invitation-create-test feature
        if: ${{ !cancelled() && steps.dwcli.outcome == 'success' }}
        working-directory: rust
        run: cargo test -p dwcli --features invitation-create-test --locked --no-fail-fast
      - name: dwcli tests with the platform-addr-fund feature
        if: ${{ !cancelled() && steps.dwcli.outcome == 'success' }}
        working-directory: rust
        run: cargo test -p dwcli --features platform-addr-fund --locked --no-fail-fast
      - name: dwcli tests with the mix-shield-test feature
        if: ${{ !cancelled() && steps.dwcli.outcome == 'success' }}
        working-directory: rust
        run: cargo test -p dwcli --features mix-shield-test --locked --no-fail-fast
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: regtest-logs
          path: regtest-logs/
          if-no-files-found: warn

  # Blocking, unlike the demo below: a red warm-up means the pinned platform revision's prover
  # broke. PR CI builds and tests the shielded code (docs/research/shielded-cost.md has the cost).
  shielded:
    name: Shielded prover warm-up (E0-12)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: ci/github/linux-free-disk.sh
      - name: Rust toolchain (rust-toolchain.toml)
        working-directory: rust
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
          shared-key: ci-${{ runner.os }}
          save-if: false
      - uses: ./.github/actions/pinned-sources
      - name: Build the warm-up example
        working-directory: rust
        run: cargo build -p dw-engine --example shielded_warmup --locked
      # Builds the Halo 2 proving key in a cold process (about 3 s on agentbox, 30 s in the upstream
      # doc comment); no network.
      - name: Prover warm-up
        working-directory: rust
        timeout-minutes: 15
        run: target/debug/examples/shielded_warmup

  # Blocking: proves the shared-masternode sending override (`test_support`, debug `test-support`
  # builds only) absent from a release build with the feature on; the test's `const` assert fails
  # the build otherwise. The debug legs run in PR CI.
  release-check:
    name: Release check (MG-04b sending override)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: ci/github/linux-free-disk.sh
      - name: Rust toolchain (rust-toolchain.toml)
        working-directory: rust
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
          shared-key: ci-${{ runner.os }}
          save-if: false
      - uses: ./.github/actions/pinned-sources
      - name: mg04b_release_check (release)
        working-directory: rust
        run: cargo test --release -p dw-engine --features test-support --test mg04b_release_check --locked
      - name: mix_shield_release_check (release)
        working-directory: rust
        run: cargo test --release -p dw-engine --features test-mix-shield --test mix_shield_release_check --locked

  # Blocking: libFuzzer on the parsers of untrusted input (H-02), 10 minutes a target, from the
  # previous nights' corpus. What a target finds is uploaded as `fuzz-findings`.
  fuzz:
    name: Fuzz the untrusted-input parsers (H-02)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      DW_FUZZ_TOOLCHAIN: nightly-2026-10-09
      DW_FUZZ_WORK: ${{ github.workspace }}/.fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: ci/github/linux-free-disk.sh
      - name: Rust toolchains (rust-toolchain.toml, and the pinned nightly) and cargo-fuzz
        working-directory: rust
        run: |
          rustup toolchain install && rustc --version
          rustup toolchain install "$DW_FUZZ_TOOLCHAIN" --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
          shared-key: ci-${{ runner.os }}
          save-if: false
      - uses: ./.github/actions/pinned-sources
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: scripts/fuzz.sh (10 minutes a target)
        run: scripts/fuzz.sh "$DW_FUZZ_WORK" 600
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: .fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fuzz-findings
          path: |
            .fuzz/artifacts/
            .fuzz/logs/
          if-no-files-found: warn

  # Blocking: the kill -9 matrix (H-03). Each row runs an operation in a child process (this test
  # binary), kills it with SIGKILL at a named point and checks what the relaunch finds.
  kill9:
    name: Kill -9 matrix (H-03)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: ci/github/linux-free-disk.sh
      - name: Rust toolchain (rust-toolchain.toml)
        working-directory: rust
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
          shared-key: ci-${{ runner.os }}
          save-if: false
      - uses: ./.github/actions/pinned-sources
      - name: kill -9 rows
        working-directory: rust
        run: cargo test -p dw-engine --lib --locked kill9 -- --ignored --skip kill9_finding

  # While a scheduled run is red, one open issue labelled nightly-failure names its failed jobs;
  # the next green run closes it. A cancelled job counts as red: a job that runs out of time may
  # be reported so. crossui-linux is non-blocking and is left out.
  report:
    name: Report the nightly's result
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: [regtest, shielded, release-check, fuzz, kill9]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ci/github
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          RUN: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A rerun of an older night must not open, update or close the issue of a newer one.
          # A first attempt always reports: a newer run can only be queued behind it.
          if [ "$ATTEMPT" -gt 1 ]; then
            if ! latest=$(gh api "repos/$GH_REPO/actions/workflows/nightly.yml/runs?event=schedule&per_page=1" \
              --jq '.workflow_runs[0].id') || [[ ! $latest =~ ^[0-9]+$ ]]; then
              echo "the latest scheduled run could not be read: the issue is left as it is" >&2
              exit 1
            fi
            if [ "$latest" != "$RUN" ]; then
              echo "run $latest is newer: nothing reported for this rerun"
              exit 0
            fi
          fi
          what="The nightly run of $(date -u +%F) at ${GITHUB_SHA:0:8}"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*)
              failed=$(gh api "repos/$GH_REPO/actions/runs/$RUN/attempts/$ATTEMPT/jobs?per_page=100" \
                --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled") | select(.name | startswith("SwiftCrossUI") | not) | "- [\(.name)](\(.html_url))"') ||
                failed="(the failed jobs could not be listed)"
              ci/github/nightly-issue.sh failed "GitHub Actions" "$what failed: $RUN_URL"$'\n\n'"$failed"
              ;;
            *) ci/github/nightly-issue.sh green "GitHub Actions" "$what passed: $RUN_URL" ;;
          esac

  # Non-blocking: on the runner the demo fails 4 AT-SPI checks, two of them known-intermittent
  # (docs/ci.md, "Known gaps"). A red X here does not turn the nightly red; the regtest job does.
  crossui-linux:
    name: SwiftCrossUI AT-SPI demo (GUI, Linux; non-blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: ci/github/linux-free-disk.sh
      - name: scripts/crossui-linux-demo.sh (M1 and M2 flows)
        env:
          DWD_CROSSUI_SUITE: m2
          DWD_LINUX_JOBS: "4"
        run: scripts/crossui-linux-demo.sh "$RUNNER_TEMP/crossui"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: crossui-linux-demo
          path: ${{ runner.temp }}/crossui/
          if-no-files-found: warn
