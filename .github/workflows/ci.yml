# CI on Linux, macOS and Windows (DEC-13, roadmap T-03).
#
# - lint, rust-linux: fmt, clippy and `cargo test --workspace` on Linux, and dw-app again with
#   its `selftest` feature (E0-13 D17: the workspace build proves the self-test is absent, the
#   feature build that it works); rust-linux then regenerates the Tauri bindings
#   (apps/desktop/src/api/generated and the E0-13 facade coverage table) and fails if they
#   differ from the committed ones, and checks the committed Swift bindings against dw-ffi
#   (scripts/build-core.sh --check-bindings). lint also runs `cargo deny check advisories` (BL-151,
#   rust/deny.toml) so a RustSec advisory against Cargo.lock fails CI. lint first checks that
#   every tracked path can be checked out on Windows (ci/github/windows-paths.py).
# - desktop-renderer: the Tauri renderer (apps/desktop): design tokens, tsc, vitest, the
#   production and fixture bundles (scripts/check-bundle.mjs: neither fixture marker and none of
#   the fixture sources' literals in production), the guard's negative control, and the test of
#   tauri-selftest.yml's report judge.
# - ui-playwright: Playwright on the fixture backend in Chromium and WebKit, light and dark, with
#   axe, inside the pinned Playwright image and without Rust or the engine (U-07), in two shards
#   (ui-playwright-shard) whose reports it merges. Same commands locally:
#   apps/desktop/scripts/e2e-docker.sh.
# - e2e-tauri-linux: tauri-driver drives the real app on the real engine (a dwcli regtest wallet)
#   under Xvfb: apps/desktop/scripts/e2e-tauri.sh (launch link, second-launch forwarding, U-01).
# - deep-links: on Linux, macOS and Windows, the packaged app (a debug bundle with the
#   `selftest` feature) registers dash:, pay:, dashwallet: and dashpay:, and links the OS opens
#   reach the running app and route (ci/github/deep-links.sh, U-01).
# - swift-linux: the Linux Swift tests (the headless suites of scripts/linux-docker-test.sh
#   plus DashUICrossTests: the UI T0 tier) with Swift 6.3.3, then the SwiftCrossUI app launched
#   under Xvfb with a screenshot.
# - macos: engine tests (`cargo test --workspace`). macos-swift, alongside it: the Rust core bundle,
#   every Swift suite (MacUITests render the screens offscreen), the macOS app built with XcodeGen +
#   xcodebuild, installed to /Applications and launched, with screenshots.
# - windows-cross-check: on Linux, `cargo clippy --workspace --all-targets` for x86_64-pc-windows-gnu
#   (MinGW-w64), on main, nightly and a dispatch (not on pull requests).
# - windows: engine build, tests and clippy (MSVC). windows-swift builds the Swift side and
#   dash-wallet (WinUIBackend), whose launch still crashes; it does not fail the run
#   (docs/ci.md, "Known gaps").
#
# Every `run` step uses bash with pipefail (Git Bash on Windows) unless it says otherwise.
# Screenshots and logs are uploaded as the `screenshots-<os>` artifacts.
name: CI

# A branch is checked through its pull request only: a push trigger for it as well ran every
# job twice, and the hosted macOS runners are the scarce ones.
# Pull requests run the fast Linux checks their changes need (the `changes` job). Playwright and the
# macOS, Windows, deep-link, E2E and Swift jobs run on pushes to main, nightly and on a dispatch
# (`gh workflow run ci.yml --ref <branch>` runs them all for a branch); docs/ci.md, "Triggers".
on:
  push:
    branches: [main]
    # A docs-only merge runs nothing, as a docs-only pull request does (the `changes` job): docs/ and *.md,
    # except the docs that tests read (and Vendor/, whose PATCHES.md the Swift repo checks read). The 02:47
    # UTC run still runs everything. On a very large push GitHub matches only part of the changed files.
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "docs/contracts/**"
      - "docs/design/E0-13-facade-coverage.md"
      - "Vendor/**"
      - "docs/**/*.rs"
      - "docs/**/*.swift"
      - "docs/**/*.ts"
      - "docs/**/*.tsx"
      - "docs/**/*.js"
      - "docs/**/*.mjs"
      - "docs/**/*.json"
      - "docs/**/*.toml"
      - "docs/**/*.yml"
      - "docs/**/*.yaml"
      - "docs/**/*.sh"
      - "docs/**/*.py"
  pull_request:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Superseded runs are cancelled on every ref except main. On main the running run always finishes, so
# main gets a complete result even on a busy merge day; GitHub keeps one pending run per group, so a burst of
# merges queues a single run for the newest head behind it. The event is in the group, so a merge never waits
# on the 02:47 UTC run or a dispatch. A re-run (attempt 2+) gets its own group. main-result.yml reports a
# cancelled main run that already had a failed job as red.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}${{ github.run_attempt > 1 && format('-rerun-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  PROTOC_VERSION: "29.3"
  # scripts/disk-guard.sh: hosted runners have less free disk than a dev machine.
  DWD_MIN_FREE_GB: "5"
  # The headless suites of scripts/linux-docker-test.sh, SwiftCrossUIPatchTests included (Linux and
  # the Windows headless filter).
  DWD_SWIFT_LINUX_SUITES: DashKitTests|DesignTokensTests|RepoChecksTests|WalletRuntimeTests|WalletFeaturesTests|PlatformServicesDesktopTests|SwiftCrossUIPatchTests

jobs:
  # What a pull request runs, by its changed files (docs/ci.md, "Pull request checks"). While in
  # development every pull request runs only the fast checks and may merge in batches; Playwright
  # and the platform matrix run on main and nightly, and a red main is fixed before the next merge.
  # - docs/ or *.md only (not docs/contracts or the generated E0-13 coverage table): nothing.
  # - only apps/desktop (not the paths Rust tests read, below): desktop-renderer (tokens, tsc, vitest,
  #   and dw-protx's no_operator_signing scan of apps/desktop/src).
  # - anything else, unknown paths included: lint, rust-linux and desktop-renderer; rust-linux tests only the
  #   changed packages when every such file is under rust/crates/<pkg>/ or rust/bin/<pkg>/ (`crates`).
  # With FUNDS_FULL_SUITE true, a funds path (any renderer file but i18n catalogs and stylesheets, any
  # Rust or Swift file, or a path naming a funds word) runs every required job.
  # Skipped required jobs report success. Every other event, and any failure here, runs them all.
  # This job is a required check too: a run cancelled while it is pending skips the four jobs,
  # and its own cancelled check then blocks the merge.
  changes:
    name: What this pull request changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Restore full per-PR CI on funds paths before RC (11-30) / 1.0: set this to "true".
      FUNDS_FULL_SUITE: "false"
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      renderer: ${{ steps.diff.outputs.renderer }}
      ui: ${{ steps.diff.outputs.ui }}
      crates: ${{ steps.diff.outputs.crates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name == 'pull_request' }}
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: diff
        run: |
          rust=true renderer=true ui=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            # NUL-separated: git quotes unusual names otherwise. A failed diff fails this job.
            git diff --no-renames --name-only -z HEAD^1 HEAD > "$RUNNER_TEMP/changed"
            docs_code='^docs/contracts/|^docs/design/E0-13-facade-coverage\.md$|\.(rs|swift|ts|tsx|js|mjs|json|toml|ya?ml|sh|py)$'
            docs='^docs/|\.md$'
            renderer_only='^apps/desktop/'
            # Renderer files the Rust tests read (docs/ci.md, "Pull request checks"): these run rust-linux.
            read_by_rust='^apps/desktop/src/(api/generated/|fixture/vectors/|fixture/handlers\.ts$|dashpay/editProfile\.ts$)'
            # Funds paths: send, signing, CoinJoin, keys, wallet storage, fees and coin selection,
            # the engine and the Swift and Rust bindings.
            funds_tree='^rust/|^Sources/|^Tests/|^Package\.(swift|resolved)$|^apps/desktop/src/api/|\.(rs|swift)$'
            funds_word='send|sign|psbt|coin|fee|key|seed|phrase|mnemonic|vault|wallet|backup|restore|recover|lock|secur|biometr|transfer|withdraw|shield|mix|protx|masternode|collateral|governance|top-?up|fund|pay|utxo|balance|credit|regist|asset|spend|amount|address|invit|tx|pin'
            # Renderer code can reach a funds flow from any file: only catalogs and stylesheets are exempt.
            copy='^apps/desktop/src/(i18n/catalog/[^/]+\.ts|styles/[^/]+\.css)$'
            rust=false renderer=false ui=false any=false full=false crates=""
            while IFS= read -r -d '' f; do
              any=true
              if [[ $f =~ $docs && ! $f =~ $docs_code && ! $f =~ $read_by_rust ]]; then kind=docs
              elif [[ $f =~ $renderer_only && ! $f =~ $read_by_rust ]]; then kind=renderer renderer=true
              else kind=all rust=true renderer=true
                # Rust tests (Linux) tests only the workspace packages a pull request changes; any other
                # file that runs it (manifests, the lock, ci/, scripts, read_by_rust) runs the whole workspace.
                if [[ $f =~ ^rust/(crates|bin)/([^/]+)/ && -f rust/${BASH_REMATCH[1]}/${BASH_REMATCH[2]}/Cargo.toml ]]; then
                  [[ " $crates " == *" ${BASH_REMATCH[2]} "* ]] || crates="$crates ${BASH_REMATCH[2]}"
                else full=true
                fi
              fi
              if [[ $FUNDS_FULL_SUITE == true && $kind != docs && ! $f =~ $copy ]] \
                && [[ $f =~ $renderer_only || $f =~ $funds_tree || ${f,,} =~ $funds_word ]]; then
                kind=funds rust=true renderer=true ui=true full=true
              fi
              echo "$kind $f"
            done < "$RUNNER_TEMP/changed"
            [[ $any == true ]] || rust=true renderer=true ui=true
            [[ $any == true && $full == false ]] || crates=""
            [[ $rust == true ]] || ci/github/windows-paths.py
          fi
          printf 'rust=%s\nrenderer=%s\nui=%s\ncrates=%s\n' "$rust" "$renderer" "$ui" "${crates# }" | tee -a "$GITHUB_OUTPUT"

  lint:
    name: Rust lint (fmt, clippy)
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.rust == 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tracked paths are valid on Windows
        working-directory: .
        run: ci/github/windows-paths.py
      - name: Funds review gate and ci/funds-paths.txt (docs/ci.md, "Funds review gate")
        working-directory: .
        run: python3 ci/github/funds-gate-test.py
      - name: Linux packages for the workspace (WebKitGTK for dw-app)
        # A download that has not finished in a minute has stalled on a mirror (it takes seconds);
        # the next attempt uses the Azure mirror. The default deadline is 6 minutes.
        env:
          DW_APT_DOWNLOAD_DEADLINE: "60"
        uses: ./.github/actions/linux-host-deps
      # Only that toolchain: rust-cache's key hashes every installed one.
      - name: Rust toolchain (rust-toolchain.toml)
        run: ../ci/github/rust-toolchain-only.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
          shared-key: ci-${{ runner.os }}
          save-if: false
      - uses: ./.github/actions/pinned-sources
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p dw-app --all-targets --features selftest --locked -- -D warnings
      - run: cargo clippy -p dwcli --all-targets --features mix-shield-test --locked -- -D warnings
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-deny-${{ runner.os }}-${{ runner.arch }}-0.20.2
      - name: cargo-deny
        run: env -u CARGO_TARGET_DIR cargo install cargo-deny --version 0.20.2 --locked
      - name: RustSec advisories (Cargo.lock; ignores in rust/deny.toml)
        run: cargo deny --locked check advisories

  # The Windows code paths, cross-compiled from Linux with MinGW-w64: the same command as the Windows
  # job's clippy, for the GNU target instead of MSVC. Not on pull requests (runner time; fix forward):
  # on main, nightly and a dispatch, where it reports before the Windows job does.
  windows-cross-check:
    name: Windows cross-check (mingw)
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'pull_request' && !(needs.changes.result == 'success' && needs.changes.outputs.rust == 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: MinGW-w64 compilers
        working-directory: .
        env:
          DW_APT_DOWNLOAD_DEADLINE: "60"
        run: ci/github/linux-host-deps.sh mingw
      # Only that toolchain, as in Rust lint, plus the Windows GNU target.
      - name: Rust toolchain (rust-toolchain.toml) and x86_64-pc-windows-gnu
        run: ../ci/github/rust-toolchain-only.sh && rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
          shared-key: ci-mingw-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/pinned-sources
      - run: cargo clippy --workspace --all-targets --locked --target x86_64-pc-windows-gnu -- -D warnings
      - run: cargo clippy -p dw-app --all-targets --features selftest --locked --target x86_64-pc-windows-gnu -- -D warnings

  rust-linux:
    name: Rust tests (Linux)
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.rust == 'false') }}
    runs-on: ubuntu-24.04
    # Cold runs (no cache restored) take about 45 min, warm ones under 20. This job alone saves
    # the ci-Linux cache, only on main and only when it succeeds, so it must be able to finish cold.
    timeout-minutes: 150
    # On a pull request that changes only workspace packages, CRATES names them and only their tests
    # run (with `-p`); the whole workspace runs on main, nightly and a dispatch, and fixes go forward.
    # Rust lint's `clippy --workspace --all-targets` still compiles every crate on the pull request.
    env:
      CRATES: ${{ github.event_name == 'pull_request' && needs.changes.outputs.crates || '' }}
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No linux-free-disk.sh: the runner starts with about 90 GB free; a cold run uses about 20.
      - name: Linux packages for the workspace (WebKitGTK for dw-app)
        # A download that has not finished in a minute has stalled on a mirror (it takes seconds);
        # the next attempt uses the Azure mirror. The default deadline is 6 minutes.
        env:
          DW_APT_DOWNLOAD_DEADLINE: "60"
        uses: ./.github/actions/linux-host-deps
      # Only that toolchain: rust-cache's key hashes every installed one.
      - name: Rust toolchain (rust-toolchain.toml)
        run: ../ci/github/rust-toolchain-only.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
          shared-key: ci-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/pinned-sources
      # dw-app's build writes files that cargo then finds newer than the build, so the next cargo
      # command would compile dw-app again (about 60 s): tauri-codegen's assets in its OUT_DIR,
      # named by their content hash, and tauri-build's permissions/autogenerated, which it watches
      # once permissions/ exists. They are what this build generated: date them before it.
      - name: cargo test --workspace --no-run --locked
        id: build
        run: |
          if [[ -n $CRATES ]]; then
            echo "Pull request: only the tests of $CRATES"
            read -ra pkgs <<< "$CRATES"
            cargo test --no-run --locked "${pkgs[@]/#/--package=}"
          else
            cargo test --workspace --no-run --locked
          fi
          shopt -s nullglob
          generated=(target/debug/build/dw-app-*/out)
          [[ -d crates/dw-app/permissions ]] && generated+=(crates/dw-app/permissions)
          (( ${#generated[@]} == 0 )) || find "${generated[@]}" -exec touch -d @0 {} +
      # `cargo test --workspace --locked --no-fail-fast` in two concurrent lanes (libraries' unit
      # tests and doc tests; bins' unit tests and integration tests), each binary in one process.
      - name: cargo test --workspace (two lanes)
        run: |
          if [[ -n $CRATES ]]; then
            read -ra pkgs <<< "$CRATES"
            cargo test --locked --no-fail-fast "${pkgs[@]/#/--package=}"
          else
            ../ci/github/cargo-test-lanes.sh
          fi
      # MG-01's scan reads every crate, bin and the renderer: a pull request that tests only other
      # packages still runs it.
      - name: No operator-key signing (dw-protx no_operator_signing)
        if: ${{ !cancelled() && env.CRATES != '' && !contains(format(' {0} ', env.CRATES), ' dw-protx ') }}
        run: cargo test -p dw-protx --test no_operator_signing --locked
      # Without the feature, dw-app's tests prove the self-test's options, commands and grant
      # are absent; with it, that they work (E0-13 D17). The workspace is selected, so only dw-app
      # is compiled again.
      - name: dw-app with the selftest feature
        if: ${{ !cancelled() && (env.CRATES == '' || contains(format(' {0} ', env.CRATES), ' dw-app ')) }}
        run: |
          if [[ -n $CRATES ]]; then
            cargo test -p dw-app --features dw-app/selftest --locked --no-fail-fast
          else
            ../ci/github/cargo-test-package.sh dw-app --features dw-app/selftest
          fi
      # Without the feature (the workspace run above), dwcli has no `coinjoin-test-addresses`; with
      # it, the command parses and dw-engine's probe sees the test calls, so the nightly's release
      # leg of mix_shield_release_check isn't vacuous. With `invitation-create-test`, the table
      # tests cover its `invite create` row. The three runs share one feature set, so dw-engine and
      # dwcli compile once: the table tests read only `invitation-create-test`, the coinjoin tests
      # only `mix-shield-test` and the release check only `test-mix-shield`. The Nightly runs
      # dwcli's whole suite with each debug feature on its own.
      - name: dwcli and dw-engine with the debug features
        if: ${{ !cancelled() && (env.CRATES == '' || contains(format(' {0} ', env.CRATES), ' dwcli ') || contains(format(' {0} ', env.CRATES), ' dw-engine ')) }}
        run: |
          debug=(-p dwcli -p dw-engine --locked --no-fail-fast
            --features dwcli/invitation-create-test,dwcli/mix-shield-test,dw-engine/test-mix-shield)
          cargo test "${debug[@]}" --bin dwcli -- --exact \
            dashpay::tests::the_table_covers_every_dashpay_command \
            dashpay::tests::every_command_passes_the_session_grammar \
            dashpay::tests::every_command_reports_its_stub_as_a_json_error | tee "$RUNNER_TEMP/dwcli-table.txt"
          grep -q '^test result: ok\. 3 passed' "$RUNNER_TEMP/dwcli-table.txt"
          cargo test "${debug[@]}" --bin dwcli -- coinjoin::tests
          cargo test "${debug[@]}" --test mix_shield_release_check
      # E0-13: the TypeScript bindings and the facade coverage table are generated from dw-app;
      # regenerate them and fail when the committed files differ (or a new file is missing).
      # `--workspace --lib` reuses the test binary the workspace build made.
      - name: Regenerate the Tauri bindings and check them in
        # Also after a failed test step (stale bindings fail it): the diff shows what changed.
        if: ${{ !cancelled() }}
        run: |
          scope=--workspace
          [[ -z $CRATES ]] || scope=--package=dw-app
          DW_UPDATE_BINDINGS=1 cargo test "$scope" --lib --locked -- --exact \
            codegen::tests::bindings_are_current coverage::tests::coverage_doc_is_current | tee "$RUNNER_TEMP/bindings.txt"
          [ "$(grep -c '^test .* \.\.\. ok$' "$RUNNER_TEMP/bindings.txt")" -eq 2 ]
          cd ..
          git add -N apps/desktop/src/api/generated docs/design/E0-13-facade-coverage.md
          git diff --exit-code -- apps/desktop/src/api/generated docs/design/E0-13-facade-coverage.md
      # The Swift bindings are generated from dw-ffi and committed too. The Swift jobs check them, but
      # those run only after a merge: a pull request that changed an exported item's doc comment
      # and not the Swift file left main red twice (#189, #193). build-core.sh builds dw-ffi alone,
      # so cargo gives its dependencies their non-test feature set and compiles many of them a
      # second time: about 9 min on the first run, 7 of them that build. Not after a failed
      # build: it would only compile again to print the same error.
      - name: The committed Swift bindings match dw-ffi
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (env.CRATES == '' || contains(format(' {0} ', env.CRATES), ' dw-ffi ') || contains(format(' {0} ', env.CRATES), ' uniffi-bindgen ')) }}
        run: ../scripts/build-core.sh --check-bindings
      - name: Disk use
        if: ${{ !cancelled() }}
        run: df -h / && du -sh target

  desktop-renderer:
    name: Tauri renderer (tokens, tsc, vitest)
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.renderer == 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm tokens:check
      - run: pnpm typecheck
      - run: pnpm test
      # Each build ends with scripts/check-bundle.mjs: dist/ must hold neither fixture marker and
      # none of the fixture sentinels (literals of src/fixture), and dist-fixture/ must hold them
      # all (the positive control).
      - run: pnpm build
      - run: pnpm build:fixture
      # The negative controls: an unmarked copy of a fixture module outside src/fixture (wallet.ts,
      # a new .mts module, errors.ts) or of its test data (vectors/accept.json as ?raw, ?url,
      # ?inline, ?url&inline and JSON) must fail the production build at check-bundle.
      - name: Fixture guard negative control
        run: scripts/guard-negative-control.sh
      # tauri-selftest.yml's verdict: a report missing a required screen must fail it.
      - name: selftest judge (ci/github/selftest-judge.jq)
        working-directory: .
        run: ci/github/selftest-judge-test.sh
      # rust-linux runs this with the workspace; a pull request that skips rust-linux runs it here,
      # because it scans apps/desktop/src for operator-key signing (MG-01).
      - name: Rust toolchain (rust-toolchain.toml)
        if: ${{ needs.changes.outputs.rust == 'false' }}
        working-directory: rust
        run: ../ci/github/rust-toolchain-only.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ needs.changes.outputs.rust == 'false' }}
        with:
          workspaces: rust -> target
          shared-key: ci-${{ runner.os }}
          save-if: false
      - name: No operator-key signing (dw-protx no_operator_signing)
        if: ${{ needs.changes.outputs.rust == 'false' }}
        working-directory: rust
        run: cargo test -p dw-protx --test no_operator_signing --locked

  # The suite in two shards (`--shard`), each a blob report; `ui-playwright` merges them into the one
  # HTML report and is the required check. Each shard's limit is about twice its slowest run on a
  # slow hosted runner (docs/ci.md, "UI tests"); Playwright's own timeouts catch a hung test.
  ui-playwright-shard:
    name: UI tests (Playwright, axe), shard ${{ matrix.shard }} of 2
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.ui == 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # The browsers and their libraries, pinned to @playwright/test in package.json (bump both).
    # No Rust and no engine: the renderer runs on the fixture backend.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host --init
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json
      - run: pnpm install --frozen-lockfile
      - name: The image matches @playwright/test
        run: |
          want=$(node -p 'require("./package.json").devDependencies["@playwright/test"]')
          have=$(pnpm exec playwright --version)
          [[ "$have" == "Version $want" ]] || { echo "::error::image has $have, package.json pins $want"; exit 1; }
      - run: pnpm build:fixture
      # Half of each project's tests, a project at a time: a single --shard cuts the run's list in
      # two in order, which gave one shard most of Chromium and the other most of WebKit (slower).
      - name: playwright test (scenarios, light and dark, axe, errors, lock report, security)
        env:
          CI: "1"
          SHARD: ${{ matrix.shard }}
        run: |
          status=0
          for project in chromium webkit; do
            PLAYWRIGHT_BLOB_OUTPUT_DIR="blob-report/$project" PLAYWRIGHT_BLOB_OUTPUT_NAME="report-$project-$SHARD.zip" \
              pnpm exec playwright test --project="$project" --shard="$SHARD/2" --reporter=list,blob --output "test-results/$project" || status=1
          done
          exit "$status"
      # Once, in the first shard. Non-blocking until the baselines (made with scripts/e2e-docker.sh)
      # have proven stable on the hosted runners (docs/ci.md, "UI tests"); a mismatch uploads the
      # actual and diff images.
      - name: Visual baselines (non-blocking)
        if: ${{ !cancelled() && matrix.shard == 1 }}
        continue-on-error: true
        timeout-minutes: 15
        env:
          CI: "1"
          DW_VISUAL: "1"
        run: pnpm exec playwright test --project=chromium e2e/visual.spec.ts --output test-results/visual --reporter=list --global-timeout=780000
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ui-playwright-shard-${{ matrix.shard }}
          path: |
            apps/desktop/blob-report/
            apps/desktop/test-results/
          if-no-files-found: warn
          retention-days: 3

  # The required check. Green only when both shards passed: a failed, cancelled or skipped shard
  # fails it. It skips where the shards do (a pull request that changes no UI).
  ui-playwright:
    name: UI tests (Playwright, axe)
    needs: [changes, ui-playwright-shard]
    if: ${{ always() && !(needs.changes.result == 'success' && needs.changes.outputs.ui == 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host --init
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ !cancelled() }}
        with:
          pattern: ui-playwright-shard-*
          path: apps/desktop/shards
      - name: One HTML report from both shards
        if: ${{ !cancelled() }}
        run: |
          mkdir -p blob-report test-results
          find shards -path '*/blob-report/*' -name '*.zip' -exec cp {} blob-report/ \;
          for d in shards/*/; do
            if [[ -d "$d/test-results" ]]; then cp -r "$d"/test-results/. test-results/; fi
          done
          pnpm exec playwright merge-reports --reporter html blob-report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ui-playwright
          path: |
            apps/desktop/test-results/
            apps/desktop/playwright-report/
          if-no-files-found: warn
      - name: Both shards passed
        if: always()
        env:
          SHARDS: ${{ needs.ui-playwright-shard.result }}
        run: |
          [[ "$SHARDS" == success ]] || { echo "::error::the Playwright shards ended '$SHARDS', not success"; exit 1; }

  e2e-tauri-linux:
    name: Tauri E2E (tauri-driver, Linux)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        working-directory: .
        run: ci/github/linux-free-disk.sh
      - name: Linux packages (WebKitGTK, its WebDriver, Xvfb)
        uses: ./.github/actions/linux-host-deps
      # Only that toolchain, as in rust-linux, whose cache this job restores.
      - name: Rust toolchain (rust-toolchain.toml)
        working-directory: rust
        run: ../ci/github/rust-toolchain-only.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
          shared-key: ci-${{ runner.os }}
          save-if: false
      - uses: ./.github/actions/pinned-sources
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/tauri-driver
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: tauri-driver-${{ runner.os }}-${{ runner.arch }}-2.1.0
      - name: tauri-driver
        run: env -u CARGO_TARGET_DIR cargo install tauri-driver --version 2.1.0 --locked
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The script runs itself under dbus-run-session: second launches find the app on that bus.
      - name: Smoke (debug app + dwcli, real engine, regtest wallet) under Xvfb
        env:
          DW_E2E_OUT: ${{ github.workspace }}/e2e-tauri-out
        run: xvfb-run -a -s "-screen 0 1280x800x24" pnpm e2e:tauri
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-tauri-linux
          path: e2e-tauri-out/
          if-no-files-found: warn

  deep-links:
    name: Deep links (${{ matrix.os }})
    if: ${{ github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        os: [linux, macos, windows]
    runs-on: ${{ fromJSON('{"linux":"ubuntu-24.04","macos":"macos-latest","windows":"windows-latest"}')[matrix.os] }}
    timeout-minutes: 150
    env:
      MATRIX_OS: ${{ matrix.os }}
      # As in the windows job (ci/windows/unistd-shim/unistd.h); unused elsewhere.
      CFLAGS_x86_64_pc_windows_msvc: -I${{ github.workspace }}/ci/windows/unistd-shim
    steps:
      - name: Git for Windows settings (long paths, LF checkouts)
        if: ${{ matrix.os == 'windows' }}
        run: |
          git config --system core.longpaths true
          git config --system core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        if: ${{ matrix.os == 'linux' }}
        run: ci/github/linux-free-disk.sh
      - name: Linux packages (WebKitGTK, Xvfb, D-Bus, xdg-utils)
        if: ${{ matrix.os == 'linux' }}
        uses: ./.github/actions/linux-host-deps
      # On Linux only that toolchain, as in rust-linux, whose cache the Linux leg restores; the
      # macOS and Windows caches are saved by jobs that keep the image's stable.
      - name: Rust toolchain (rust-toolchain.toml), Linux
        if: ${{ matrix.os == 'linux' }}
        working-directory: rust
        run: ../ci/github/rust-toolchain-only.sh
      - name: Rust toolchain (rust-toolchain.toml)
        if: ${{ matrix.os != 'linux' }}
        working-directory: rust
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          CFLAGS_x86_64_pc_windows_msvc: ${{ runner.os == 'Windows' && env.CFLAGS_x86_64_pc_windows_msvc || '' }}
        with:
          workspaces: rust -> target
          shared-key: ci-${{ runner.os }}
          save-if: false
      - uses: ./.github/actions/pinned-sources
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: pnpm install
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      # A debug bundle (quick to build) with the self-test's `--selftest-link-trace`; release
      # bundles register the same schemes from the same configuration.
      - name: pnpm tauri build --debug --features selftest (one bundle)
        working-directory: apps/desktop
        run: |
          case "$MATRIX_OS" in
            linux) kind=deb; glob='deb/*.deb' ;;
            macos) kind=app; glob='macos/*.app' ;;
            windows) kind=nsis; glob='nsis/*-setup.exe' ;;
          esac
          pnpm tauri build --debug --features selftest --bundles "$kind"
          # Through `pwd`, not $GITHUB_WORKSPACE: on Windows that is a `D:\a\…` path, whose
          # backslashes a glob reads as escapes.
          dir=$(cd ../../rust/target/debug/bundle && pwd)
          bundle=$(compgen -G "$dir/$glob" | head -n 1)
          [[ -n "$bundle" ]] || { echo "::error::no $kind bundle"; exit 1; }
          echo "BUNDLE=$bundle" >> "$GITHUB_ENV"
      - name: Links through the OS
        # It takes under a minute; a hang fails here, and the upload below still keeps its trace.
        timeout-minutes: 10
        run: |
          export DW_LINKS_OUT=$PWD/deep-links-out
          if [[ "$MATRIX_OS" == linux ]]; then
            dbus-run-session -- xvfb-run -a -s "-screen 0 1280x800x24" ci/github/deep-links.sh linux "$BUNDLE"
          else
            ci/github/deep-links.sh "$MATRIX_OS" "$BUNDLE"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: deep-links-${{ matrix.os }}
          path: deep-links-out/
          if-no-files-found: warn

  swift-linux:
    name: Swift + UI T0 (Linux)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: ci/github/linux-free-disk.sh
      - name: Linux packages (GTK 4, Xvfb, AT-SPI)
        run: ci/github/linux-host-deps.sh swiftcrossui
      - name: Swift 6.3.3 (swiftly)
        run: ci/github/linux-swiftly.sh 6.3.3
      # Only that toolchain, as in rust-linux, whose cache this job restores.
      - name: Rust toolchain (rust-toolchain.toml)
        working-directory: rust
        run: ../ci/github/rust-toolchain-only.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
          shared-key: ci-${{ runner.os }}
          save-if: false
      - uses: ./.github/actions/pinned-sources
      - name: Rust core bundle (and check the committed bindings)
        run: scripts/build-core.sh --check-bindings
      # By product: a plain `swift build --build-tests` also compiles swift-winui's
      # Windows-only C targets, which fail on Linux.
      - name: swift build (test product and dash-wallet, with GTK)
        run: |
          swift build --product DashWalletDesktopPackageTests
          swift build --product dash-wallet
      - name: swift test (headless suites + DashUICrossTests)
        run: |
          "$(swift build --show-bin-path)/DashWalletDesktopPackageTests.xctest" --testing-library swift-testing \
            --filter "$DWD_SWIFT_LINUX_SUITES|DashUICrossTests"
      - name: Launch dash-wallet --demo under Xvfb and take a screenshot
        env:
          DWD_SHOT_SETTLE: "60"
        run: ci/github/linux-launch-screenshot.sh "$(swift build --show-bin-path)/dash-wallet" screenshots 20
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots-linux
          path: screenshots/
          if-no-files-found: warn

  # The engine tests and the Swift side run as two jobs at once: in one job the Swift steps waited
  # for `cargo test` and added 10 to 30 minutes to every main run (docs/ci.md, "Main CI wall time").
  macos:
    name: macOS (engine)
    timeout-minutes: 150
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          df -h /System/Volumes/Data
      - name: Rust toolchain (rust-toolchain.toml)
        working-directory: rust
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
          shared-key: ci-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/pinned-sources
      - name: cargo test --workspace
        working-directory: rust
        run: cargo test --workspace --locked --no-fail-fast

  macos-swift:
    name: macOS (Swift, app)
    timeout-minutes: 120
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          df -h /System/Volumes/Data
      - name: Rust toolchain (rust-toolchain.toml)
        working-directory: rust
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
          shared-key: ci-${{ runner.os }}
          save-if: false
      - uses: ./.github/actions/pinned-sources
      - name: Rust core bundle (and check the committed bindings)
        run: scripts/build-core.sh --check-bindings
      - name: swift build
        run: swift build --build-tests
      - name: swift test (every suite; MacUITests also write the offscreen screenshots)
        env:
          DWD_WRITE_SCREENSHOTS: "1"
        run: swift test --skip-build
      - name: Build the macOS app (XcodeGen + xcodebuild)
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          (cd Apps/macOS && xcodegen generate)
          xcodebuild -quiet -project Apps/macOS/DashWallet.xcodeproj -scheme DashWallet -configuration Debug \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath .derived build
      - name: Install to /Applications
        run: |
          sudo ditto ".derived/Build/Products/Debug/Dash Wallet.app" "/Applications/Dash Wallet.app"
          codesign --verify --verbose "/Applications/Dash Wallet.app"
      - name: Launch the installed app (demo, light and dark) and take screenshots
        run: |
          app="/Applications/Dash Wallet.app"
          ci/github/macos-launch-screenshot.sh macos-app-light screenshots 20 "$app" --demo --appearance light
          ci/github/macos-launch-screenshot.sh macos-app-dark screenshots 20 "$app" --demo --appearance dark
      # Known gap (docs/ci.md): this development build crashes at launch on the runner; G-03
      # measures SwiftCrossUI on macOS. On a crash, an lldb backtrace is uploaded with the screenshots.
      - name: Launch dash-wallet (SwiftCrossUI, AppKitBackend) and take a screenshot
        continue-on-error: true
        run: |
          bin="$(swift build --show-bin-path)/dash-wallet"
          ci/github/macos-launch-screenshot.sh macos-crossui-demo screenshots 20 "$bin" --demo && exit 0
          perl -e 'alarm shift; exec @ARGV' 120 lldb --batch -o run -k 'thread backtrace all' -k quit -- "$bin" --demo \
            > screenshots/macos-crossui-demo-backtrace.txt 2>&1 || true
          grep -m1 -A40 'stop reason' screenshots/macos-crossui-demo-backtrace.txt || tail -n 40 screenshots/macos-crossui-demo-backtrace.txt
          exit 1
      - name: Collect the offscreen renders and crash reports
        if: always()
        run: |
          mkdir -p screenshots/crash-reports
          find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports -maxdepth 1 \( -name 'dash-wallet*' -o -name 'Dash Wallet*' \) \
            -exec cp {} screenshots/crash-reports/ \; 2>/dev/null || true
          [[ ! -d docs/screenshots/ux/mac ]] || cp -R docs/screenshots/ux/mac screenshots/offscreen
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots-macos
          path: screenshots/
          if-no-files-found: warn

  windows:
    name: Windows (engine)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      # rs-x11-hash includes <unistd.h>, which MSVC lacks (ci/windows/unistd-shim/unistd.h).
      CFLAGS_x86_64_pc_windows_msvc: -I${{ github.workspace }}/ci/windows/unistd-shim
    steps:
      # Long paths for cargo's git checkouts; LF checkouts so the committed bindings and scripts
      # compare and run as on the other OSes.
      - name: Git for Windows settings
        run: |
          git config --system core.longpaths true
          git config --system core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Disk space
        run: df -h . || true
      - name: Rust toolchain (rust-toolchain.toml)
        working-directory: rust
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
          shared-key: ci-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/pinned-sources
      - name: cargo build --workspace
        working-directory: rust
        run: cargo build --workspace --locked
      # dw-app (Tauri, G-01) is left out until its test binaries embed the Common Controls v6
      # manifest: without it they fail to load on Windows (tauri#13419; docs/ci.md, "Known gaps").
      # Until dw-app exists cargo only warns about the exclusion.
      - name: cargo test --workspace (without dw-app)
        working-directory: rust
        run: cargo test --workspace --exclude dw-app --locked --no-fail-fast
      - name: cargo clippy (the Windows code paths)
        working-directory: rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Known gap (docs/ci.md): dash-wallet builds with WinUIBackend but its launch crashes (G-03).
  # This job tracks the Swift side without failing the run: the Windows variant of the Rust core
  # bundle, the headless Swift suites, and dash-wallet launched with a screenshot.
  windows-swift:
    name: Windows Swift (known gap, non-blocking)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    timeout-minutes: 150
    continue-on-error: true
    env:
      # As in the windows job (ci/windows/unistd-shim/unistd.h).
      CFLAGS_x86_64_pc_windows_msvc: -I${{ github.workspace }}/ci/windows/unistd-shim
    steps:
      # Long paths for cargo's git checkouts; LF checkouts so the committed bindings and scripts
      # compare and run as on the other OSes.
      - name: Git for Windows settings
        run: |
          git config --system core.longpaths true
          git config --system core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (rust-toolchain.toml)
        working-directory: rust
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
          shared-key: ci-${{ runner.os }}
          save-if: false
      - uses: ./.github/actions/pinned-sources
      - uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057 # v0.5.0
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE
      - name: Rust core bundle (windows-x86_64 variant)
        run: scripts/build-core.sh --check-bindings
      - name: swift build (headless)
        id: headless
        shell: pwsh
        env:
          DWD_HEADLESS: "1"
        run: |
          swift --version
          swift build --build-tests
      - name: swift test (headless suites)
        if: ${{ !cancelled() && steps.headless.outcome == 'success' }}
        shell: pwsh
        env:
          DWD_HEADLESS: "1"
        run: swift test --skip-build --filter "$env:DWD_SWIFT_LINUX_SUITES"
      - name: swift build dash-wallet (WinUIBackend)
        id: app
        if: ${{ !cancelled() }}
        shell: pwsh
        run: swift build --product dash-wallet
      # WinUIBackend needs the Windows App Runtime 1.5, which windows-latest lacks: without it the
      # app stops at "This application requires the Windows App Runtime" (run 37804634973).
      # Pinned: the installer aka.ms/windowsappsdk/1.5/latest resolved to on 2026-10-08, which installs
      # Microsoft.WindowsAppRuntime.1.5 5001.373.1736.0. Checked by SHA-256 and by a valid
      # Authenticode signature from Microsoft Corporation before it runs.
      - name: Windows App Runtime 1.5
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        shell: pwsh
        run: |
          $url = 'https://download.microsoft.com/download/4f5a8b87-f017-485d-8cf7-c16e82671dbe/WindowsAppRuntimeInstall-x64.exe'
          $sha256 = '7418DC8DC18CFEE1CDC1B087A326EA6FD66E2E3A5E1C76D49FA948737A83A45E'
          $installer = Join-Path $env:RUNNER_TEMP 'WindowsAppRuntimeInstall-x64.exe'
          for ($attempt = 1; ; $attempt++) {
            try { Invoke-WebRequest -Uri $url -OutFile $installer; break }
            catch {
              if ($attempt -ge 5) { throw }
              Write-Host "download attempt $attempt failed: $($_.Exception.Message)"
              Start-Sleep -Seconds 5
            }
          }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($hash -ne $sha256) { throw "Windows App Runtime installer SHA-256 $hash, expected $sha256" }
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '^CN=Microsoft Corporation,') {
            throw "Windows App Runtime installer signature: $($signature.Status), $($signature.SignerCertificate.Subject)"
          }
          Write-Host "verified: SHA-256 $hash, signed by $($signature.SignerCertificate.Subject)"
          & $installer --quiet --force
          if ($LASTEXITCODE -ne 0) { throw "Windows App Runtime installer exited with $LASTEXITCODE" }
          Get-AppxPackage -Name 'Microsoft.WindowsAppRuntime.1.5*' | Select-Object Name, Version | Format-Table
      - name: Launch dash-wallet --demo and take a screenshot
        # !cancelled(): without a status function `if` also requires every earlier step to pass.
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        shell: pwsh
        run: |
          $bin = swift build --show-bin-path
          ci/github/windows-launch-screenshot.ps1 -Name windows-crossui-demo -OutDir screenshots `
            -Exe (Join-Path $bin 'dash-wallet.exe') -ArgumentList '--demo'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots-windows
          path: screenshots/
          if-no-files-found: ignore
