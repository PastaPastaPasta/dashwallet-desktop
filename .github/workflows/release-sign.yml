# Sign a release candidate in CI and publish it (docs/release/CI-SIGNING.md).
#
# release.yml built the tag's unsigned files and attested them (repository variable DW_SIGN_RC=1). This
# workflow takes the place of the release signer's Mac in docs/release/RC-SIGNING.md:
#
#   sign      runs the same ci/release/sign-*.sh scripts on a hosted macOS runner. It is the only job that
#             sees signing credentials, and it reaches them only through the `release-signing` environment
#             (required reviewer, v* tags only). It builds nothing and installs no project dependency: it
#             downloads the attested files, signs them, and uploads the detached signatures and the .dmg
#             as a run artifact. It cannot write to the repository.
#   publish   calls release-publish-signed.yml, which holds no secret: it re-attaches the signatures to
#             CI's own unsigned bytes, verifies every one against the identities pinned in this
#             repository at the tag, attests the result and publishes the prerelease.
#
# Credentials, all in the `release-signing` environment:
#   macOS     secrets APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_API_KEY_P8;
#             variables APPLE_API_KEY_ID, APPLE_API_ISSUER_ID
#   Windows   no stored secret: GitHub's OIDC token signs in to Azure Artifact Signing. Variables
#             AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_SIGNING_ENDPOINT,
#             AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE
#   PGP       secrets RELEASE_PGP_PRIVATE_KEY, RELEASE_PGP_PASSPHRASE: a key of CI's own (ci_pgp_fingerprint),
#             never the release key or a subkey of it, and accepted for candidates only
#
# Until the Azure account exists, `windows_sig_ref` takes the Windows signature from the detached-signatures
# repository instead (made on the YubiKey with ci/release/sign-windows.sh); macOS and PGP are still signed here.
#
# A stable tag vX.Y.Z is refused: its updater feed needs the stable updater key, which is not in CI.
name: Sign release in CI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Candidate tag to sign and publish (v1.0.0-rc.2; dispatch with --ref <tag>)"
        required: true
        type: string
      release_run_id:
        description: "Actions run ID of the Release workflow run that built the tag's unsigned files"
        required: true
        type: string
      windows_sig_ref:
        description: "Leave empty to sign Windows with Azure Artifact Signing. Or: branch, tag or commit in sigs_repo holding win/<setup.exe>.pem signed on the YubiKey"
        required: false
        default: ""
        type: string
      sigs_repo:
        description: "Detached-signatures repository (owner/name), read only when windows_sig_ref is set"
        required: false
        default: PastaPastaPasta/dashwallet-detached-sigs
        type: string
      dry_run:
        description: "Sign and verify everything, then stop before attesting and publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  JSIGN_VERSION: "7.6"
  JSIGN_SHA256: 6cf58aa080e7ff82656f320cff8d4a3bff30408df8766806dcba3740dd839fa5

jobs:
  sign:
    name: Sign macOS, Windows and SHA256SUMS
    environment: release-signing
    runs-on: macos-15
    timeout-minutes: 150
    permissions:
      actions: read
      attestations: read
      contents: read
      id-token: write
    concurrency:
      group: release-sign-refs/tags/${{ inputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Validate inputs and ref guard
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_RUN_ID: ${{ inputs.release_run_id }}
          INPUT_WIN_REF: ${{ inputs.windows_sig_ref }}
          INPUT_SIGS_REPO: ${{ inputs.sigs_repo }}
        run: |
          [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]] || {
            echo "::error::tag must be a candidate vX.Y.Z-rc.N (got '$INPUT_TAG'); a stable tag is signed by docs/release/SIGNING.md" >&2
            exit 1
          }
          [[ "$GITHUB_REF" == "refs/tags/$INPUT_TAG" ]] || {
            echo "::error::workflow must be dispatched with --ref $INPUT_TAG (got GITHUB_REF='$GITHUB_REF')" >&2
            exit 1
          }
          [[ "$INPUT_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::release_run_id must be numeric (got '$INPUT_RUN_ID')" >&2
            exit 1
          }
          if [[ -n "$INPUT_WIN_REF" ]]; then
            [[ "$INPUT_WIN_REF" =~ ^[A-Za-z0-9._/-]+$ && "$INPUT_WIN_REF" != *..* && "$INPUT_WIN_REF" != -* ]] || {
              echo "::error::invalid windows_sig_ref '$INPUT_WIN_REF'" >&2
              exit 1
            }
            [[ "$INPUT_SIGS_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || {
              echo "::error::invalid sigs_repo '$INPUT_SIGS_REPO'" >&2
              exit 1
            }
          fi
          {
            echo "TAG=$INPUT_TAG"
            echo "VERSION=${INPUT_TAG#v}"
            echo "UNSIGNED=$RUNNER_TEMP/unsigned"
            echo "SIGS=$RUNNER_TEMP/sigs"
            echo "OUT=$RUNNER_TEMP/out"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag commit matches github.sha and is on origin/main
        run: |
          git fetch --quiet origin "+refs/tags/$TAG:refs/tags/$TAG" '+refs/heads/main:refs/remotes/origin/main'
          sha=$(git rev-parse HEAD)
          tag_commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          [[ "$sha" == "$GITHUB_SHA" && "$tag_commit" == "$sha" ]] || {
            echo "::error::refs/tags/$TAG points to $tag_commit, but checked-out HEAD is $sha (GITHUB_SHA=$GITHUB_SHA)" >&2
            exit 1
          }
          git merge-base --is-ancestor "$sha" refs/remotes/origin/main || {
            echo "::error::$TAG ($sha) is not an ancestor of origin/main; refusing to sign" >&2
            exit 1
          }
          echo "TAG_SHA=$sha" >> "$GITHUB_ENV"
      # Before any credential is used: a tag whose pins are placeholders could only fail at publish.
      - name: The signing identities are pinned at this tag
        env:
          INPUT_WIN_REF: ${{ inputs.windows_sig_ref }}
        run: |
          ids=docs/release/signing-identities.json
          jq -e '((.ci_pgp_fingerprint // "") | test("^[0-9A-Fa-f]{40}$")) and (.apple_team_id | test("^[A-Z0-9]{10}$"))' "$ids" >/dev/null || {
            echo "::error::$ids does not pin ci_pgp_fingerprint and apple_team_id at $TAG (docs/release/CI-SIGNING.md)" >&2
            exit 1
          }
          jq -e '((.ci_pgp_fingerprint | ascii_upcase) != ((.pgp_fingerprint // "") | ascii_upcase))' "$ids" >/dev/null || {
            echo "::error::ci_pgp_fingerprint is the release key's fingerprint in $ids: CI holds a key of its own" >&2
            exit 1
          }
          # Azure signs under windows_signer; a YubiKey signature (windows_sig_ref) under windows_leaf_sha256.
          if [[ -z "$INPUT_WIN_REF" ]]; then
            jq -e '(has("windows_signer")) and (.windows_signer | (.organization | type == "string" and length > 0 and (test("REPLACE_|[\\n\\r]") | not)) and (.eku | type == "string" and test("^1[.]3[.]6[.]1[.]4[.]1[.]311[.]97[.][0-9]+[.][0-9]+[.][0-9]+[.][0-9]+$"))) and (((.windows_leaf_sha256 // "") | test("^sha256:[0-9a-fA-F]{64}$")) | not)' "$ids" >/dev/null || {
              echo "::error::signing Windows with Azure needs windows_signer (organization and the identity's own EKU) and no windows_leaf_sha256 in $ids at $TAG" >&2
              exit 1
            }
          else
            jq -e '(has("windows_signer") | not) and ((.windows_leaf_sha256 // "") | test("^sha256:[0-9a-fA-F]{64}$"))' "$ids" >/dev/null || {
              echo "::error::windows_sig_ref takes a YubiKey signature, which needs windows_leaf_sha256 and no windows_signer in $ids at $TAG" >&2
              exit 1
            }
          fi
          grep -qx -- '-----BEGIN PGP PUBLIC KEY BLOCK-----' docs/release/ci-release-key.asc || {
            echo "::error::docs/release/ci-release-key.asc is not CI's public key at $TAG" >&2
            exit 1
          }
          if grep -qx -- '-----BEGIN CERTIFICATE-----' docs/release/windows-ca.pem; then
            echo "WIN_CA=docs/release/windows-ca.pem" >> "$GITHUB_ENV"
          elif jq -e '.windows_signer' "$ids" >/dev/null; then
            echo "::error::windows_signer needs the signer's and the timestamp's roots in docs/release/windows-ca.pem" >&2
            exit 1
          fi
      - name: Install osslsigncode, gnupg and jsign
        run: |
          brew install osslsigncode gnupg
          osslsigncode --version
          gpg --version | head -n 2
          java -version
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/jsign.jar" \
            "https://github.com/ebourg/jsign/releases/download/$JSIGN_VERSION/jsign-$JSIGN_VERSION.jar"
          echo "$JSIGN_SHA256  $RUNNER_TEMP/jsign.jar" | shasum -a 256 -c -
          # Before any key is used: the committed public key is the pinned one, or publishing would fail later.
          want=$(jq -r '.ci_pgp_fingerprint | ascii_upcase' docs/release/signing-identities.json)
          gpg --show-keys --with-colons docs/release/ci-release-key.asc |
            awk -F: '$1 == "pub" { p = 1; next } p && $1 == "fpr" { print toupper($10); p = 0 }' | grep -qx "$want" || {
            echo "::error::docs/release/ci-release-key.asc does not hold the key pinned as ci_pgp_fingerprint at $TAG" >&2
            exit 1
          }
      - name: Download and attestation-verify the unsigned build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.release_run_id }}
        run: |
          ci/release/fetch-unsigned.sh --tag "$TAG" --tag-sha "$TAG_SHA" --run-id "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" --unsigned-dir "$UNSIGNED" --sigs-dir "$SIGS"
          mkdir -p "$OUT/dist"

      - name: Sign in to Azure with GitHub's OIDC token (no stored secret)
        if: ${{ inputs.windows_sig_ref == '' }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Windows, sign the installer with Azure Artifact Signing
        if: ${{ inputs.windows_sig_ref == '' }}
        env:
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          [[ -n "$AZURE_SIGNING_ENDPOINT" && -n "$AZURE_SIGNING_ACCOUNT" && -n "$AZURE_SIGNING_PROFILE" ]] || {
            echo "::error::AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT and AZURE_SIGNING_PROFILE are not set in the release-signing environment" >&2
            exit 1
          }
          endpoint=${AZURE_SIGNING_ENDPOINT#https://}
          endpoint=${endpoint%/}
          AZURE_SIGNING_TOKEN=$(az account get-access-token --resource https://codesigning.azure.net --query accessToken --output tsv)
          echo "::add-mask::$AZURE_SIGNING_TOKEN"
          export AZURE_SIGNING_TOKEN
          args=(
            --version "$VERSION" --unsigned-dir "$UNSIGNED" --sigs-dir "$SIGS" --out-dir "$OUT"
            --jsign-jar "$RUNNER_TEMP/jsign.jar"
            --jsign-storetype TRUSTEDSIGNING
            --jsign-keystore "$endpoint"
            --jsign-alias "$AZURE_SIGNING_ACCOUNT/$AZURE_SIGNING_PROFILE"
            --jsign-storepass-env AZURE_SIGNING_TOKEN
            --tsa http://timestamp.acs.microsoft.com
          )
          [[ -z "${WIN_CA:-}" ]] || args+=(--ca-file "$WIN_CA")
          ci/release/sign-windows.sh "${args[@]}"
      - name: Windows, attach the YubiKey signature from the detached-signatures repository
        if: ${{ inputs.windows_sig_ref != '' }}
        env:
          SIGS_REPO: ${{ inputs.sigs_repo }}
          WIN_REF: ${{ inputs.windows_sig_ref }}
        run: |
          exe="dash-wallet-$VERSION-windows-x64-setup.exe"
          git init --quiet "$RUNNER_TEMP/sigs-repo"
          git -C "$RUNNER_TEMP/sigs-repo" fetch --quiet --depth 1 "https://github.com/$SIGS_REPO.git" "$WIN_REF"
          git -C "$RUNNER_TEMP/sigs-repo" checkout --quiet --detach FETCH_HEAD
          root="$RUNNER_TEMP/sigs-repo"
          [[ ! -d "$root/$TAG" ]] || root="$root/$TAG"
          pem="$root/win/$exe.pem"
          [[ -f "$pem" && ! -L "$pem" ]] || { echo "::error::$SIGS_REPO@$WIN_REF has no win/$exe.pem" >&2; exit 1; }
          cmp -s "$root/unsigned.SHA256SUMS" "$SIGS/unsigned.SHA256SUMS" || {
            echo "::error::$SIGS_REPO@$WIN_REF was signed over another build: its unsigned.SHA256SUMS differs from this run's" >&2
            exit 1
          }
          mkdir -p "$SIGS/win"
          cp "$pem" "$SIGS/win/$exe.pem"
          osslsigncode attach-signature -in "$UNSIGNED/$exe" -sigin "$SIGS/win/$exe.pem" -out "$OUT/dist/$exe"

      # Before anything else is signed: SHA256SUMS.asc must never cover an installer another publisher signed.
      # The publish job asks the same question again, with the same script.
      - name: Windows, the signed installer is the pinned publisher's
        env:
          INPUT_WIN_REF: ${{ inputs.windows_sig_ref }}
        run: |
          ids=docs/release/signing-identities.json
          args=(--exe "$OUT/dist/dash-wallet-$VERSION-windows-x64-setup.exe")
          if [[ -z "$INPUT_WIN_REF" ]]; then
            args+=(--signer-org "$(jq -r .windows_signer.organization "$ids")" --signer-eku "$(jq -r .windows_signer.eku "$ids")")
          else
            args+=(--leaf-hash "$(jq -r .windows_leaf_sha256 "$ids" | tr '[:upper:]' '[:lower:]')")
          fi
          [[ -z "${WIN_CA:-}" ]] || args+=(--ca-file "$WIN_CA")
          ci/github/windows-verify-pinned.sh "${args[@]}"

      - name: macOS, import the Developer ID certificate and the notarization key
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: ci/release/ci-signing-keys.sh apple docs/release/signing-identities.json
      - name: macOS, codesign, notarize and staple the app and the .dmg
        env:
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
        run: |
          [[ -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER_ID" ]] || {
            echo "::error::APPLE_API_KEY_ID and APPLE_API_ISSUER_ID are not set in the release-signing environment" >&2
            exit 1
          }
          ci/release/sign-macos.sh --version "$VERSION" --unsigned-dir "$UNSIGNED" --sigs-dir "$SIGS" --out-dir "$OUT" \
            --identity "$APPLE_SIGNING_IDENTITY" \
            --api-key-path "$APPLE_API_KEY_PATH" --api-key-id "$APPLE_API_KEY_ID" --api-issuer "$APPLE_API_ISSUER_ID"

      - name: PGP, import CI's candidate signing key
        env:
          RELEASE_PGP_PRIVATE_KEY: ${{ secrets.RELEASE_PGP_PRIVATE_KEY }}
          RELEASE_PGP_PASSPHRASE: ${{ secrets.RELEASE_PGP_PASSPHRASE }}
        run: ci/release/ci-signing-keys.sh pgp docs/release/signing-identities.json
      - name: PGP, write and sign SHA256SUMS
        env:
          RELEASE_PGP_PASSPHRASE: ${{ secrets.RELEASE_PGP_PASSPHRASE }}
        run: |
          for suffix in linux-x86_64.AppImage linux-amd64.deb linux-x86_64.flatpak sbom-rust.cdx.json sbom-npm.cdx.json; do
            cp "$UNSIGNED/dash-wallet-$VERSION-$suffix" "$OUT/dist/"
          done
          fpr=$(jq -r .ci_pgp_fingerprint docs/release/signing-identities.json)
          ci/release/sign-checksums.sh --version "$VERSION" --dist-dir "$OUT/dist" --sigs-dir "$SIGS" \
            --gpg-key "$fpr" --passphrase-fd 3 3<<<"$RELEASE_PGP_PASSPHRASE"

      - name: Remove the keychain, the API key and the GnuPG home
        if: ${{ always() }}
        run: ci/release/ci-signing-keys.sh cleanup
      # One tar: the signature tree keeps its layout and file names ("osx/Dash Wallet.app/...") as written.
      # COPYFILE_DISABLE: no AppleDouble "._" entries for files that carry extended attributes.
      - name: Pack the detached signatures and the signed .dmg
        run: |
          mkdir -p "$RUNNER_TEMP/ci-signed"
          COPYFILE_DISABLE=1 tar -cf "$RUNNER_TEMP/ci-signed/signatures.tar" -C "$RUNNER_TEMP" sigs
          cp "$OUT/dist/dash-wallet-$VERSION-macos-universal.dmg" "$RUNNER_TEMP/ci-signed/"
          tar -tf "$RUNNER_TEMP/ci-signed/signatures.tar"
      # Three days: the publish job reads it once its own approval, if any, is given; a signed .dmg should
      # not linger on the run longer.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-signed-${{ inputs.tag }}
          path: ${{ runner.temp }}/ci-signed/
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Verify, attest and publish
    needs: sign
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-publish-signed.yml
    with:
      tag: ${{ inputs.tag }}
      release_run_id: ${{ inputs.release_run_id }}
      signed_artifact: ci-signed-${{ inputs.tag }}
      dry_run: ${{ inputs.dry_run }}
