# A red CI or Release run on main (a push or the 02:47 UTC run) is a stop: main is fixed, by a
# forward fix on top or a revert, before anything else merges (docs/ci.md, "Pull request checks"). While the
# newest finished run of that workflow is red, one open issue labelled nightly-failure names its
# failed jobs and the pull requests merged since that workflow's last green run on main. The next
# green run closes it. A cancelled run (a pending main run replaced by a newer one) reports nothing.
name: Main result

on:
  workflow_run:
    workflows: [CI, Release]
    types: [completed]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  report:
    name: Report ${{ github.event.workflow_run.name }} on main
    if: >-
      ${{ github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'schedule')
      && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out') }}
    # On the job, not the workflow: a pull request's completion is skipped by `if` before it can
    # take the group and replace a pending main report.
    concurrency:
      group: main-result-${{ github.event.workflow_run.name }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout: ci/github
      # Reports the newest finished main run of the workflow, whichever completion started this job:
      # a rerun of an older run, a replayed report or a report that replaced a pending one all
      # reconcile the issue with the current result.
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW: ${{ github.event.workflow_run.workflow_id }}
        run: |
          finished=$(gh api --paginate "repos/$GH_REPO/actions/workflows/$WORKFLOW/runs?branch=main&status=completed&per_page=100" \
            --jq '.workflow_runs[] | select((.event == "push" or .event == "schedule")
              and (.conclusion == "success" or .conclusion == "failure" or .conclusion == "timed_out"))' | jq -s 'sort_by(.created_at) | reverse')
          [[ $(jq length <<<"$finished") -gt 0 ]] || { echo "::error::no finished $NAME run on main found" >&2; exit 1; }
          read -r run attempt sha conclusion url < <(jq -r '.[0] | "\(.id) \(.run_attempt) \(.head_sha) \(.conclusion) \(.html_url)"' <<<"$finished")
          what="$NAME on main at ${sha:0:8}"
          if [[ $conclusion == success ]]; then
            ci/github/nightly-issue.sh green "$NAME on main" "$what passed: $url"
            exit 0
          fi
          failed=$(gh api "repos/$GH_REPO/actions/runs/$run/attempts/$attempt/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled") | "- [\(.name)](\(.html_url))"') ||
            failed="(the failed jobs could not be listed)"
          green=$(jq -r '[.[] | select(.conclusion == "success")][0].head_sha // empty' <<<"$finished")
          if [[ -z $green ]]; then
            batch="(no green $NAME run on main found)"
          else
            # First-parent history of main: one line per merge, whether merged, squashed or rebased.
            if ! git merge-base --is-ancestor "$green" "$sha" 2>/dev/null; then
              batch="(the last green run's commit ${green:0:8} is not an ancestor of ${sha:0:8}: the batch could not be listed)"
            elif ! batch=$(git log -n 50 --first-parent --format='- %h %s' "$green..$sha"); then
              batch="(the commits since ${green:0:8} could not be listed)"
            else
              batch="Merged since the last green run (${green:0:8}; up to the 50 most recent, all at $GITHUB_SERVER_URL/$GH_REPO/compare/$green...$sha):"$'\n'"$batch"
            fi
          fi
          ci/github/nightly-issue.sh failed "$NAME on main" \
            "$what failed: $url"$'\n\n'"$failed"$'\n\n'"$batch"$'\n\n'"Fix main before anything else merges: a forward fix on top is fine; a revert is not required."
