# A red CI or Release run on main (a push or the 02:47 UTC run) is a stop: main is fixed, by a
# forward fix on top or a revert, before anything else merges (docs/ci.md, "Pull request checks"). While the
# newest finished run of that workflow is red, one open issue labelled nightly-failure names its
# failed jobs and the pull requests merged since that workflow's last green run on main. The next
# green run closes it. A cancelled run (a pending main run replaced by a newer one) reports nothing.
name: Main result

on:
  workflow_run:
    workflows: [CI, Release]
    types: [completed]

permissions:
  contents: read

jobs:
  report:
    name: Report ${{ github.event.workflow_run.name }} on main
    if: >-
      ${{ github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'schedule')
      && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out') }}
    # On the job, not the workflow: a pull request's completion is skipped by `if` before it can
    # take the group and replace a pending main report.
    concurrency:
      group: main-result-${{ github.event.workflow_run.name }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ci/github
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW: ${{ github.event.workflow_run.workflow_id }}
          RUN: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          # Only the newest finished main run, at its latest attempt, may open, update or close the
          # issue: a rerun of an older run, or a replayed report of an older attempt, reports nothing.
          finished=$(gh api "repos/$GH_REPO/actions/workflows/$WORKFLOW/runs?branch=main&status=completed&per_page=100" \
            --jq '[.workflow_runs[] | select((.event == "push" or .event == "schedule")
              and (.conclusion == "success" or .conclusion == "failure" or .conclusion == "timed_out"))]')
          newest=$(jq -r '.[0] | "\(.id) \(.run_attempt)"' <<<"$finished")
          if [[ $newest != "$RUN $ATTEMPT" ]]; then
            echo "the newest finished run is $newest, not $RUN $ATTEMPT: nothing reported"
            exit 0
          fi
          what="$NAME on main at ${SHA:0:8}"
          if [[ $CONCLUSION == success ]]; then
            ci/github/nightly-issue.sh green "$NAME on main" "$what passed: $RUN_URL"
            exit 0
          fi
          failed=$(gh api "repos/$GH_REPO/actions/runs/$RUN/attempts/$ATTEMPT/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled") | "- [\(.name)](\(.html_url))"') ||
            failed="(the failed jobs could not be listed)"
          green=$(jq -r '[.[] | select(.conclusion == "success")][0].head_sha // empty' <<<"$finished")
          if [[ -z $green ]]; then
            batch="(no green $NAME run on main among the last 50 finished runs)"
          else
            # Merge commits when there are any; squash and rebase merges leave only plain commits.
            # shellcheck disable=SC2016 # $m is jq's
            batch=$(gh api "repos/$GH_REPO/compare/$green...$SHA" \
              --jq '[.commits[] | select(.parents | length > 1)] as $m | (if ($m | length) > 0 then $m else .commits end)
                | .[-50:][] | "- \(.sha[0:8]) \(.commit.message | split("\n")[0])"') ||
              batch="(the commits since ${green:0:8} could not be listed)"
            batch="Merged since the last green run (${green:0:8}):"$'\n'"$batch"
          fi
          ci/github/nightly-issue.sh failed "$NAME on main" \
            "$what failed: $RUN_URL"$'\n\n'"$failed"$'\n\n'"$batch"$'\n\n'"Fix main before anything else merges: a forward fix on top is fine; a revert is not required."
