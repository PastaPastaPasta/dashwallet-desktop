# ci/github/linux-host-deps.sh tauri with its .deb files kept in the Actions cache, per runner
# image: one entry (about 96 MB) for every Linux job that needs WebKitGTK. The tauri set includes
# the rust set, so the Rust jobs install it too, which costs them a few seconds. A hit installs
# without the network once ci/github/apt-cache.sh has verified every .deb against the image's
# Ubuntu archive keyring (release file signature, then the Packages index, then the .deb); any
# break fails the job. A miss downloads as before (retries, mirror fallback) and saves, except on a
# pull request: pull requests read main's entry and never write one, so they cannot crowd the Rust
# caches out of the repository's cache budget.
#
# live-first (Release's Linux job): a hit is tried live first, once and under a short deadline, so
# a security update published since the entry was saved reaches the release; only when that fails
# do the verified cached files install.
name: Linux packages (cached)
description: ci/github/linux-host-deps.sh tauri, with the .deb files cached and verified on every use
inputs:
  live-first:
    description: "'true': download live first and install from the verified cache only if that fails"
    default: 'false'
runs:
  using: composite
  steps:
    - id: image
      shell: bash
      run: echo "image=${ImageOS:?}-${ImageVersion:?}" >> "$GITHUB_OUTPUT"
    - id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/apt-cache
        key: apt-tauri-${{ steps.image.outputs.image }}-${{ runner.arch }}-${{ hashFiles('ci/github/linux-host-deps.sh', 'ci/github/apt-cache.sh') }}
    - id: deps
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        DW_APT_CACHE: ${{ runner.temp }}/apt-cache
        APT_CACHE_KEY: ${{ steps.restore.outputs.cache-primary-key }}
        DW_APT_LIVE_FIRST: ${{ inputs.live-first == 'true' && '1' || '' }}
        DW_APT_SAVE: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      run: ci/github/linux-host-deps.sh tauri
    - if: steps.restore.outputs.cache-hit != 'true' && steps.deps.outputs.saved == '1' && github.event_name != 'pull_request'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/apt-cache
        key: ${{ steps.restore.outputs.cache-primary-key }}
